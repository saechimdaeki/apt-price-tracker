name: send-teams-from-json

on:
  # schedule:
  #   # KST 13:00 (평일) = UTC 04:00 (월~금)
  #   - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      region_filter:
        description: "지역명 포함 필터 (예: 수원_매탄동). 비우면 전체"
        required: false
        default: ""

jobs:
  build-report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      total_count: ${{ steps.build.outputs.total_count }}
      bargain_count: ${{ steps.build.outputs.bargain_count }}
      cheap_count: ${{ steps.build.outputs.cheap_count }}
      relisted_count: ${{ steps.build.outputs.relisted_count }}
      off_market_candidate_count: ${{ steps.build.outputs.off_market_candidate_count }}
      off_market_count: ${{ steps.build.outputs.off_market_count }}
      run_label: ${{ steps.build.outputs.run_label }}
      data_label: ${{ steps.build.outputs.data_label }}
      top_bargains: ${{ steps.build.outputs.top_bargains }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build HTML report
        id: build
        shell: bash
        env:
          REGION_FILTER: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.region_filter || '') || '' }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          data_dir = pathlib.Path("data")
          primary = data_dir / "apt-listings.json"
          shard_files = sorted(data_dir.glob("apt-listings-s*.json"))
          source_files = shard_files if shard_files else ([primary] if primary.exists() else [])
          if not source_files:
              raise SystemExit("apt listings JSON not found (expected data/apt-listings.json or data/apt-listings-s*.json)")

          raw_items = []
          for src in source_files:
              with src.open("r", encoding="utf-8") as f:
                  loaded = json.load(f)
              if not isinstance(loaded, list):
                  raise SystemExit(f"{src} must be a JSON array")
              raw_items.extend(x for x in loaded if isinstance(x, dict))

          # articleNo 기준으로 병합 (updatedAt 최신값 우선)
          merged_by_article = {}
          no_key_items = []
          for item in raw_items:
              article_no = str(item.get("articleNo", "")).strip()
              if not article_no:
                  no_key_items.append(item)
                  continue
              prev = merged_by_article.get(article_no)
              if prev is None or str(item.get("updatedAt", "")) >= str(prev.get("updatedAt", "")):
                  merged_by_article[article_no] = item

          data = list(merged_by_article.values()) + no_key_items

          region_filter = (os.getenv("REGION_FILTER") or "").strip()

          def as_int(v, default=0):
              try:
                  return int(v)
              except Exception:
                  return default

          def as_float(v, default=0.0):
              try:
                  return float(v)
              except Exception:
                  return default

          def format_price(price_man):
              p = as_int(price_man, 0)
              if p < 10_000:
                  return f"{p}만"
              eok = p // 10_000
              man = p % 10_000
              return f"{eok}억" if man == 0 else f"{eok}억 {man}만"

          def format_area_sqm(value):
              v = as_float(value, 0.0)
              if v <= 0:
                  return "-"
              text = f"{v:.2f}".rstrip("0").rstrip(".")
              return text

          def format_area_pyeong(value):
              v = as_float(value, 0.0)
              if v <= 0:
                  return "-"
              py = v / 3.3058
              text = f"{py:.1f}".rstrip("0").rstrip(".")
              return text

          def derive_pyeong(item):
              supply = as_float(item.get("areaSupplySqm", 0.0), 0.0)
              if supply > 0:
                  return supply / 3.3058
              return float(as_int(item.get("pyeong", 0), 0))

          def normalize_tag_list(value):
              if isinstance(value, list):
                  items = value
              elif isinstance(value, str):
                  items = [x.strip() for x in value.split(",")]
              else:
                  items = []
              seen = set()
              result = []
              for item in items:
                  text = str(item).strip()
                  if not text or text in seen:
                      continue
                  seen.add(text)
                  result.append(text)
              return result

          def normalize_status(v):
              s = str(v or "ACTIVE").strip().upper()
              valid = {"ACTIVE", "RELISTED", "OFF_MARKET_CANDIDATE", "OFF_MARKET"}
              return s if s in valid else "ACTIVE"

          def status_label(status):
              return {
                  "ACTIVE": "판매중",
                  "RELISTED": "다시 등록된 매물(판매중)",
                  "OFF_MARKET_CANDIDATE": "거래종결 후보",
                  "OFF_MARKET": "거래종결 추정",
              }.get(status, "판매중")

          listings = [x for x in data if isinstance(x, dict)]
          if region_filter:
              listings = [x for x in listings if region_filter in str(x.get("regionName", ""))]

          listings = [x for x in listings if 20.0 <= derive_pyeong(x) <= 39.999]

          status_counts = {
              "ACTIVE": 0,
              "RELISTED": 0,
              "OFF_MARKET_CANDIDATE": 0,
              "OFF_MARKET": 0,
          }
          for it in listings:
              status_counts[normalize_status(it.get("status"))] += 1

          live_statuses = {"ACTIVE", "RELISTED"}
          live_listings = [x for x in listings if normalize_status(x.get("status")) in live_statuses]
          live_listings.sort(key=lambda x: str(x.get("updatedAt", "")), reverse=True)

          def complex_key(item):
              region = str(item.get("regionName", "")).strip()
              hscp_no = str(item.get("hscpNo", "")).strip()
              title = str(item.get("title", "")).strip()
              return f"{region}::{hscp_no or title}"

          def area_key(item):
              """전용면적(㎡) 반올림 = 같은 평형 타입. 같은 단지라도 20평대와 50평대는 따로 본다."""
              area = as_float(item.get("areaExclusiveSqm", item.get("areaSqm", 0.0)), 0.0)
              if area <= 0:
                  area = as_float(item.get("areaSupplySqm", 0.0), 0.0)
              return str(int(round(area))) if area > 0 else "-"

          def peer_key(item):
              return f"{complex_key(item)}::{area_key(item)}"

          peer_price_map = {}
          for it in live_listings:
              p = as_int(it.get("price", 0), 0)
              if p <= 0:
                  continue
              peer_price_map.setdefault(peer_key(it), []).append(p)

          def price_band_label(price):
              if price < 80_000:
                  return "8억 미만"
              if price < 90_000:
                  return "8~9억대"
              if price < 100_000:
                  return "9~10억대"
              if price < 120_000:
                  return "10~12억대"
              return "12억 이상"

          def pyeong_band_label(p):
              if 20.0 <= p < 30.0:
                  return "20평대"
              if 30.0 <= p < 40.0:
                  return "30평대"
              return "기타"

          BARGAIN_THRESHOLD_PCT = -10.0
          CHEAP_THRESHOLD_PCT = -5.0

          def price_signal(diff_pct):
              if diff_pct <= BARGAIN_THRESHOLD_PCT:
                  return "급매"
              if diff_pct <= CHEAP_THRESHOLD_PCT:
                  return "저렴"
              return "보통"

          def compact_text(value, limit):
              text = " ".join(str(value or "").split())
              if len(text) <= limit:
                  return text
              return text[:limit].rstrip() + "…"

          def compact_url(value):
              text = str(value or "").strip()
              prefix = "https://m.land.naver.com"
              if text.startswith(prefix):
                  return text[len(prefix):] or "/"
              return text

          report_rows = []
          bargain_count = 0
          cheap_count = 0

          for it in live_listings:
              region = str(it.get("regionName", ""))
              city = region.split("_", 1)[0] if "_" in region else region

              price = as_int(it.get("price", 0), 0)
              area_supply_sqm = as_float(it.get("areaSupplySqm", 0.0), 0.0)
              area_exclusive_sqm = as_float(it.get("areaExclusiveSqm", it.get("areaSqm", 0.0)), 0.0)
              pyeong = derive_pyeong(it)
              tag_list = normalize_tag_list(it.get("tagList", []))
              households = as_int(it.get("householdCount", 0), 0)
              build_year = as_int(it.get("approvalYear", 0), 0)

              prices = peer_price_map.get(peer_key(it), [])
              peer_count = len(prices)
              avg_price = round(sum(prices) / len(prices)) if prices else 0
              # 같은 평형 매물이 이 건뿐이면 비교 기준이 없다 (평균 = 자기 자신)
              comparable = peer_count >= 2 and avg_price > 0
              diff_pct = ((price - avg_price) / avg_price * 100.0) if comparable else 0.0
              signal = price_signal(diff_pct) if comparable else "보통"

              if signal == "급매":
                  bargain_count += 1
              elif signal == "저렴":
                  cheap_count += 1

              status = normalize_status(it.get("status"))
              report_rows.append(
                  {
                      "city": city,
                      "region": region,
                      "title": compact_text(it.get("title", ""), 64),
                      "featureDesc": compact_text(it.get("featureDesc", ""), 90),
                      "tagText": compact_text(" · ".join(tag_list[:6]) if tag_list else "-", 84),
                      "price": price,
                      "priceText": format_price(price),
                      "avgPrice": avg_price if comparable else 0,
                      "avgPriceText": format_price(avg_price) if comparable else "-",
                      "peerCount": peer_count,
                      "peerAreaText": (f"전용 {area_key(it)}㎡" if area_key(it) != "-" else "-"),
                      "diffPct": round(diff_pct, 2),
                      "signal": signal,
                      "statusLabel": status_label(status),
                      "priceBand": price_band_label(price),
                      "pyeongBand": pyeong_band_label(pyeong),
                      "households": households,
                      "householdsText": f"{households:,}세대" if households > 0 else "-",
                      "buildYear": build_year,
                      "buildYearText": f"{build_year}년" if build_year > 0 else "-",
                      "areaSupplySqmText": format_area_sqm(area_supply_sqm),
                      "areaExclusiveSqmText": format_area_sqm(area_exclusive_sqm),
                      "areaSupplyPyeong": (area_supply_sqm / 3.3058) if area_supply_sqm > 0 else 0.0,
                      "areaSupplyPyeongText": format_area_pyeong(area_supply_sqm),
                      "areaExclusivePyeongText": format_area_pyeong(area_exclusive_sqm),
                      "floor": str(it.get("floor", "")),
                      "complexNo": str(it.get("hscpNo", "")).strip(),
                      "url": compact_url(it.get("url", "")),
                  }
              )

          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))
          run_label = now.strftime("%Y-%m-%d %H:%M KST")

          # 화면에 보여줄 "기준 시각"은 워크플로 실행 시각이 아니라 매물이 마지막으로 수집된 시각이다.
          seen_stamps = [
              str(x.get("lastSeenAt") or x.get("updatedAt") or "")
              for x in live_listings
          ]
          data_at = max((t for t in seen_stamps if t), default="")
          data_label = (data_at[:16].replace("T", " ") + " KST") if data_at else run_label

          data_json = json.dumps(report_rows, ensure_ascii=False, separators=(",", ":"))
          # UI는 pages/index.html(레포에 커밋된 정적 파일)이 담당한다. 여기서는 데이터/메타만 생성.
          meta_json = json.dumps(
              {
                  "runLabel": run_label,
                  "dataAt": data_at,
                  "dataLabel": data_label,
                  "total": len(report_rows),
                  "regionFilter": region_filter or "",
                  "bargainThresholdPct": BARGAIN_THRESHOLD_PCT,
                  "cheapThresholdPct": CHEAP_THRESHOLD_PCT,
                  "bargainCount": bargain_count,
                  "cheapCount": cheap_count,
                  "relistedCount": status_counts["RELISTED"],
                  "offMarketCandidateCount": status_counts["OFF_MARKET_CANDIDATE"],
                  "offMarketCount": status_counts["OFF_MARKET"],
              },
              ensure_ascii=False,
          )

          out_dir = pathlib.Path("pages")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "report-data.json").write_text(data_json, encoding="utf-8")
          (out_dir / "report-meta.json").write_text(meta_json, encoding="utf-8")

          github_output = os.getenv("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as fo:
                  fo.write(f"total_count={len(report_rows)}\n")
                  fo.write(f"bargain_count={bargain_count}\n")
                  fo.write(f"cheap_count={cheap_count}\n")
                  fo.write(f"relisted_count={status_counts['RELISTED']}\n")
                  fo.write(f"off_market_candidate_count={status_counts['OFF_MARKET_CANDIDATE']}\n")
                  fo.write(f"off_market_count={status_counts['OFF_MARKET']}\n")
                  fo.write(f"run_label={run_label}\n")
                  fo.write(f"data_label={data_label}\n")
                  # 같은 단지가 상위를 독식하지 않도록 단지당 1건만
                  top = []
                  seen_complexes = set()
                  for r in sorted(
                      (r for r in report_rows if r["signal"] == "급매"),
                      key=lambda r: r["diffPct"],
                  ):
                      key = (r["region"], r["title"])
                      if key in seen_complexes:
                          continue
                      seen_complexes.add(key)
                      top.append(r)
                      if len(top) == 3:
                          break
                  top_payload = json.dumps(
                      [
                          {
                              "title": r["title"],
                              "where": r["region"].split("_", 1)[-1],
                              "price": r["priceText"],
                              "diff": r["diffPct"],
                              "url": r["url"] if r["url"].startswith("http") else "https://m.land.naver.com" + r["url"],
                          }
                          for r in top
                      ],
                      ensure_ascii=False,
                  )
                  fo.write(f"top_bargains={top_payload}\n")

          print(
              "report rows=%s, bargain=%s, cheap=%s, relisted=%s, candidate=%s, off_market=%s"
              % (
                  len(report_rows),
                  bargain_count,
                  cheap_count,
                  status_counts["RELISTED"],
                  status_counts["OFF_MARKET_CANDIDATE"],
                  status_counts["OFF_MARKET"],
              )
          )
          print("generated pages/report-data.json + report-meta.json")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy-pages:
    needs: build-report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build-report, deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
      TOTAL_COUNT: ${{ needs.build-report.outputs.total_count }}
      BARGAIN_COUNT: ${{ needs.build-report.outputs.bargain_count }}
      CHEAP_COUNT: ${{ needs.build-report.outputs.cheap_count }}
      RELISTED_COUNT: ${{ needs.build-report.outputs.relisted_count }}
      OFF_MARKET_CANDIDATE_COUNT: ${{ needs.build-report.outputs.off_market_candidate_count }}
      OFF_MARKET_COUNT: ${{ needs.build-report.outputs.off_market_count }}
      RUN_LABEL: ${{ needs.build-report.outputs.run_label }}
      DATA_LABEL: ${{ needs.build-report.outputs.data_label }}
      TOP_BARGAINS: ${{ needs.build-report.outputs.top_bargains }}
      REGION_FILTER: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.region_filter || '') || '' }}

    steps:
      - name: Send single Teams notification with report link
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          webhook = (os.getenv("TEAMS_WEBHOOK_URL") or "").strip()
          if not webhook:
              print("TEAMS_WEBHOOK_URL secret is empty")
              sys.exit(1)

          page_url = (os.getenv("PAGE_URL") or "").strip()
          total_count = os.getenv("TOTAL_COUNT", "0")
          bargain_count = os.getenv("BARGAIN_COUNT", "0")
          cheap_count = os.getenv("CHEAP_COUNT", "0")
          relisted_count = os.getenv("RELISTED_COUNT", "0")
          candidate_count = os.getenv("OFF_MARKET_CANDIDATE_COUNT", "0")
          off_market_count = os.getenv("OFF_MARKET_COUNT", "0")
          run_label = os.getenv("RUN_LABEL", "")
          region_filter = (os.getenv("REGION_FILTER") or "").strip() or "없음"

          if not page_url:
              repository = (os.getenv("GITHUB_REPOSITORY") or "").strip()
              if repository and "/" in repository:
                  owner, repo = repository.split("/", 1)
                  page_url = f"https://{owner}.github.io/{repo}/"

          data_label = (os.getenv("DATA_LABEL") or "").strip() or run_label
          try:
              top_bargains = json.loads(os.getenv("TOP_BARGAINS") or "[]")
          except json.JSONDecodeError:
              top_bargains = []

          def n(value):
              try:
                  return f"{int(value):,}"
              except (TypeError, ValueError):
                  return str(value)

          def stat(value, label, color=None):
              head = {
                  "type": "TextBlock",
                  "text": n(value),
                  "weight": "Bolder",
                  "size": "ExtraLarge",
                  "horizontalAlignment": "Center",
                  "spacing": "None",
              }
              if color:
                  head["color"] = color
              return {
                  "type": "Column",
                  "width": "stretch",
                  "items": [
                      head,
                      {
                          "type": "TextBlock",
                          "text": label,
                          "isSubtle": True,
                          "size": "Small",
                          "spacing": "None",
                          "horizontalAlignment": "Center",
                      },
                  ],
              }

          def bargain_row(idx, item):
              diff = item.get("diff", 0)
              url = item.get("url", "")
              row = {
                  "type": "ColumnSet",
                  "separator": idx > 0,
                  "spacing": "Small",
                  "columns": [
                      {
                          "type": "Column",
                          "width": "stretch",
                          "items": [
                              {"type": "TextBlock", "text": item.get("title", ""), "weight": "Bolder", "wrap": True, "spacing": "None"},
                              {
                                  "type": "TextBlock",
                                  "text": item.get("where", ""),
                                  "isSubtle": True,
                                  "size": "Small",
                                  "spacing": "None",
                              },
                          ],
                      },
                      {
                          "type": "Column",
                          "width": "auto",
                          "items": [
                              {
                                  "type": "TextBlock",
                                  "text": item.get("price", ""),
                                  "weight": "Bolder",
                                  "horizontalAlignment": "Right",
                                  "spacing": "None",
                              },
                              {
                                  "type": "TextBlock",
                                  "text": f"평균 대비 {diff:.1f}%",
                                  "color": "attention",
                                  "size": "Small",
                                  "horizontalAlignment": "Right",
                                  "spacing": "None",
                              },
                          ],
                      },
                  ],
              }
              if url:
                  # 행 전체를 눌러 매물로 이동 (Teams가 마크다운 링크를 못 살리는 경우 대비)
                  row["selectAction"] = {"type": "Action.OpenUrl", "title": item.get("title", ""), "url": url}
              return row

          body_items = [
              {
                  "type": "TextBlock",
                  "text": "아파트 매물 리포트",
                  "weight": "Bolder",
                  "size": "Large",
                  "wrap": True,
              },
              {
                  "type": "TextBlock",
                  "text": f"{data_label} 수집분 · 서울·경기 20~30평대 판매중 매물",
                  "isSubtle": True,
                  "size": "Small",
                  "spacing": "None",
                  "wrap": True,
              },
              {
                  "type": "ColumnSet",
                  "spacing": "Medium",
                  "columns": [
                      stat(total_count, "전체 매물"),
                      stat(bargain_count, "급매 (평균 -10%↓)", "attention"),
                      stat(cheap_count, "저렴 (평균 -5%↓)", "good"),
                  ],
              },
          ]

          if top_bargains:
              body_items.append(
                  {
                      "type": "TextBlock",
                      "text": "가장 싸게 나온 매물",
                      "weight": "Bolder",
                      "spacing": "Medium",
                      "wrap": True,
                  }
              )
              body_items.append(
                  {
                      "type": "Container",
                      "style": "emphasis",
                      "bleed": True,
                      "spacing": "Small",
                      "items": [bargain_row(i, it) for i, it in enumerate(top_bargains)],
                  }
              )

          body_items.append(
              {
                  "type": "FactSet",
                  "spacing": "Medium",
                  "facts": [
                      {"title": "지역 필터", "value": region_filter},
                      {"title": "판단 기준", "value": "같은 단지·같은 평형 평균 호가 대비 -10% 급매 / -5% 저렴"},
                      {"title": "상태 변화", "value": f"재등록 {n(relisted_count)} · 거래종결 후보 {n(candidate_count)} · 거래종결 추정 {n(off_market_count)}"},
                      {"title": "리포트 생성", "value": run_label},
                  ],
              }
          )

          payload = {
              "type": "message",
              "attachments": [
                  {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "contentUrl": None,
                      "content": {
                          "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.4",
                          "body": body_items,
                          "actions": [
                              {"type": "Action.OpenUrl", "title": "조건 골라서 보기", "url": page_url},
                          ],
                      },
                  }
              ],
          }

          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=30) as resp:
              status = getattr(resp, "status", None) or resp.getcode()
              print(f"teams status={status}, page_url={page_url}")
              if status < 200 or status >= 300:
                  raise SystemExit(f"Teams notify failed: {status}")
          PY
