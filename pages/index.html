<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>아파트 매물 스캐너</title>
  <meta name="description" content="매일 수집한 아파트 매물을 같은 단지 평균가와 비교합니다. 지역·예산·평형·연식·세대수·층·특징 조건으로 좁혀보세요." />
  <meta name="theme-color" content="#fbfbf9" />
  <link rel="canonical" href="https://saechimdaeki.github.io/apt-price-tracker/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="아파트 매물 스캐너" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="아파트 매물 스캐너" />
  <meta property="og:description" content="매일 수집한 매물을 같은 단지 평균가와 비교하고, 8가지 조건으로 좁혀봅니다" />
  <meta property="og:url" content="https://saechimdaeki.github.io/apt-price-tracker/" />
  <meta property="og:image" content="https://saechimdaeki.github.io/apt-price-tracker/assets/og-cover.png" />
  <meta property="og:image:secure_url" content="https://saechimdaeki.github.io/apt-price-tracker/assets/og-cover.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="아파트 매물 스캐너" />
  <meta name="twitter:description" content="매일 수집한 매물을 같은 단지 평균가와 비교하고, 8가지 조건으로 좁혀봅니다" />
  <meta name="twitter:image" content="https://saechimdaeki.github.io/apt-price-tracker/assets/og-cover.png" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root{
      color-scheme: light;
      --paper:#fbfbf9; --surface:#fff; --sunk:#f3f2ee;
      --line:#e6e4dd; --line-2:#d5d2c8;
      --ink:#14171c; --ink-2:#525a63; --ink-3:#8b929a;
      --acc:#0f6b52; --acc-weak:#e6f1ec;
      --hot:#a8321f; --hot-weak:#fbeae6;
      --warn:#8a6212;
      --r:12px; --r-sm:8px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box}
    [hidden]{display:none !important}
    html,body{margin:0;padding:0}
    body{
      background:var(--paper); color:var(--ink);
      font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased; letter-spacing:-.005em;
      font-feature-settings:"tnum" 1;
    }
    button,input{font:inherit;color:inherit;letter-spacing:inherit}
    button{cursor:pointer;background:none;border:0}
    a{color:inherit;text-decoration:none}
    ul{margin:0;padding:0;list-style:none}
    .num{font-variant-numeric:tabular-nums}

    .wrap{max-width:560px;margin:0 auto;padding:0 20px}
    .wrap.wide{max-width:1200px}
    .screen{display:none}
    .screen.on{display:block}

    /* ---- 공통 바 ---- */
    .bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
    .bar.edge{border-color:var(--line)}
    .bar-in{display:flex;align-items:center;gap:10px;height:52px}
    .back{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--ink-2);font-size:17px;margin-left:-6px}
    .back:hover{background:var(--sunk)}
    .bar-t{font-size:14px;font-weight:600;color:var(--ink-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar-a{font-size:13px;font-weight:600;color:var(--acc);border-bottom:1px solid currentColor;padding-bottom:1px}

    .btn{width:100%;height:52px;border-radius:var(--r);font-size:16px;font-weight:600;display:grid;place-items:center;transition:opacity .12s,background .12s}
    .btn-ink{background:var(--ink);color:#fff}
    .btn-ink:hover{opacity:.88}
    .btn-line{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2)}
    .btn-line:hover{background:var(--sunk)}

    /* ---- 홈 ---- */
    .home{padding-top:36px;padding-bottom:40px}
    .logo{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--acc);text-transform:uppercase}
    .home h1{font-size:26px;line-height:1.45;font-weight:700;margin:16px 0 0;letter-spacing:-.025em}
    .home h1 em{font-style:normal;background:linear-gradient(180deg,transparent 62%,var(--acc-weak) 62%)}
    .home p{font-size:15px;line-height:1.7;color:var(--ink-2);margin:14px 0 0}
    .home p b{font-weight:700;color:var(--ink)}
    .facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:26px 0 0;overflow:hidden}
    .fact{padding:16px 14px;border-left:1px solid var(--line)}
    .fact:first-child{border-left:0}
    .fact b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em}
    .fact span{display:block;font-size:12px;color:var(--ink-3);margin-top:4px;font-weight:500}
    .fact.hot b{color:var(--hot)} .fact.acc b{color:var(--acc)}
    .picks{display:grid;gap:12px;margin-top:14px}
    @media (min-width:640px){ .picks{grid-template-columns:1fr 1fr} }
    .pick{display:block;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px;transition:border-color .12s,transform .12s}
    .pick:hover{border-color:var(--ink);transform:translateY(-1px)}
    .pick .k{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
    .pick .t{font-size:18px;font-weight:700;margin-top:10px;display:flex;align-items:center;gap:6px}
    .pick .d{font-size:13.5px;line-height:1.65;color:var(--ink-2);margin-top:8px}
    .stamp{font-size:12.5px;color:var(--ink-3);margin-top:22px;line-height:1.7}
    .warn{font-size:12.5px;line-height:1.7;color:var(--warn);background:#fdf7e7;border:1px solid #f0e3bd;border-radius:var(--r-sm);padding:10px 12px;margin-top:12px}

    /* ---- 위저드 ---- */
    .wiz{padding-bottom:calc(112px + var(--safe-b))}
    .wiz,.home{padding-left:20px;padding-right:20px}
    .steps{display:flex;gap:4px;flex:1}
    .steps i{flex:1;height:3px;border-radius:2px;background:var(--line-2)}
    .steps i.done{background:var(--ink)}
    .stepno{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
    .q{font-size:21px;line-height:1.5;font-weight:700;margin:28px 0 0;letter-spacing:-.02em}
    .qs{font-size:13.5px;color:var(--ink-3);margin:8px 0 0}
    .rows{margin-top:20px;display:grid;gap:8px}
    .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;background:var(--surface);transition:border-color .12s,background .12s}
    .row:hover{border-color:var(--line-2)}
    .row.on{border-color:var(--ink);background:#fff}
    .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0}
    .row.on .box{background:var(--ink);border-color:var(--ink)}
    .row .t{font-size:15.5px;font-weight:600}
    .row .d{font-size:12.5px;color:var(--ink-3);margin-top:3px}
    .row .body{min-width:0;flex:1}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
    .tag{border:1px solid var(--line-2);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;color:var(--ink-2);background:var(--surface)}
    .tag:hover{border-color:var(--ink-3)}
    .tag.on{background:var(--ink);border-color:var(--ink);color:#fff}
    .sub{font-size:12px;font-weight:700;color:var(--ink-3);margin:20px 0 -8px;letter-spacing:.02em}
    .wfoot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(251,251,249,0),var(--paper) 30%);padding:10px 20px calc(14px + var(--safe-b))}
    .wfoot .wrap{padding:0}
    .live{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);padding:8px 0 10px}
    .live b{color:var(--acc)}
    .skip{display:block;width:100%;text-align:center;font-size:13px;font-weight:600;color:var(--ink-3);padding:18px 0 4px;text-decoration:underline;text-underline-offset:3px}

    /* ---- 결과 ---- */
    .rhead{padding:14px 0 2px}
    .rhead h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.025em;line-height:1.45}
    .rhead h1 b{color:var(--acc)}
    .rhead p{font-size:13px;color:var(--ink-3);margin:8px 0 0}
    .conds{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
    .cond{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
    .tools{position:sticky;top:52px;z-index:15;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);display:flex;gap:7px;align-items:center;padding:12px 0}
    .tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);background:var(--surface);white-space:nowrap}
    .tool:hover{border-color:var(--ink-3)}
    .tool b{background:var(--ink);color:#fff;border-radius:5px;min-width:17px;height:17px;padding:0 4px;font-size:11px;display:grid;place-items:center}
    .cnt{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}

    .list{display:grid;gap:10px;padding-bottom:28px}
    @media (min-width:820px){ .list{grid-template-columns:1fr 1fr} }
    @media (min-width:1180px){ .list{grid-template-columns:repeat(3,1fr)} }
    .item{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px}
    .item:hover{border-color:var(--line-2)}
    .i-top{display:flex;align-items:baseline;gap:8px}
    .i-price{font-size:22px;font-weight:700;letter-spacing:-.03em}
    .gap{font-size:13px;font-weight:700}
    .gap.minus{color:var(--acc)} .gap.plus{color:var(--ink-3)} .gap.zero{color:var(--ink-3)}
    .flag{margin-left:auto;border-radius:5px;padding:3px 7px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
    .f-hot{background:var(--hot-weak);color:var(--hot)}
    .f-low{background:var(--acc-weak);color:var(--acc)}
    .f-mid{background:var(--sunk);color:var(--ink-3)}
    .i-name{font-size:15.5px;font-weight:700;margin:10px 0 0;line-height:1.4}
    .i-name .rk{color:var(--ink-3);font-weight:600;margin-right:5px}
    .i-where{font-size:12.5px;color:var(--ink-3);margin:3px 0 0;font-weight:500}
    .specs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
    .spec{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0}
    .spec dt{color:var(--ink-3);font-weight:500}
    .spec dd{margin:0;font-weight:600;color:var(--ink-2);white-space:nowrap}
    .spec.wide{grid-column:1/-1}
    .spec .dim{color:var(--ink-3);font-weight:500}
    .notes{margin-top:10px;display:grid;gap:4px}
    .note{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;gap:6px;line-height:1.5}
    .note s{text-decoration:none;color:var(--acc);font-weight:700}
    .note.caution s{color:var(--warn)}
    .desc{font-size:12.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.6;font-weight:500}
    .acts{display:flex;gap:7px;margin-top:auto;padding-top:14px}
    .acts a{flex:1;text-align:center;white-space:nowrap;border-radius:var(--r-sm);padding:10px;font-size:13.5px;font-weight:600}
    .a1{background:var(--ink);color:#fff;flex:1.6}
    .a2{background:var(--sunk);color:var(--ink-2)}
    .more{margin:2px 0 40px}
    .none{padding:60px 0;text-align:center;color:var(--ink-3);font-size:14.5px;font-weight:500;line-height:1.8}
    .load{border:1px solid var(--line);border-radius:var(--r);height:196px;background:linear-gradient(90deg,#f6f5f1 25%,#efeee9 37%,#f6f5f1 63%);background-size:400% 100%;animation:sh 1.3s infinite}
    @keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

    /* ---- 조건 패널 ---- */
    .veil{position:fixed;inset:0;z-index:30;background:rgba(20,23,28,.42);display:none}
    .veil.on{display:block}
    .panel{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);border-radius:16px 16px 0 0;max-height:86dvh;display:none;flex-direction:column}
    .panel.on{display:flex}
    @media (min-width:768px){ .panel{left:50%;right:auto;width:520px;transform:translateX(-50%)} }
    .p-head{display:flex;align-items:center;padding:18px 20px 10px}
    .p-head h2{font-size:17px;font-weight:700;margin:0;flex:1}
    .p-body{overflow-y:auto;padding:0 20px 10px;-webkit-overflow-scrolling:touch}
    .p-foot{padding:12px 20px calc(14px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px}
    .p-foot .btn{height:48px}
    .p-foot .btn-line{width:92px;flex-shrink:0}
    .grp{padding:16px 0;border-top:1px solid var(--line)}
    .grp:first-child{border-top:0}
    .grp h3{font-size:13.5px;font-weight:700;margin:0 0 10px}
    .grp .tags{margin-top:0}
    .find{width:100%;height:44px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 13px;background:var(--surface);outline:none}
    .find:focus{border-color:var(--ink)}
  </style>
</head>
<body>

<!-- ===== 홈 ===== -->
<section id="vHome" class="screen on">
  <div class="wrap home">
    <p class="logo">apt scanner</p>
    <h1>매일 모은 매물을<br><em>같은 평형 평균가</em>와 비교합니다.</h1>
    <p>네이버 부동산에서 수집한 20~30평대 매물을 <b>같은 단지·같은 평형</b> 매물들의 평균 호가와 견줘, 얼마나 싸게 나왔는지 계산해 둡니다.</p>

    <div class="facts">
      <div class="fact"><b class="num" id="fTotal">–</b><span>전체 매물</span></div>
      <div class="fact hot"><b class="num" id="fHot">–</b><span>급매</span></div>
      <div class="fact acc"><b class="num" id="fLow">–</b><span>저렴</span></div>
    </div>

    <div class="picks">
      <button class="pick" data-go="wizard">
        <span class="k">01</span>
        <span class="t">조건부터 좁히기 <span aria-hidden="true">→</span></span>
        <span class="d">지역·예산·평형·연식·세대수·특징을 차례로 고르면 맞는 매물만 남깁니다.</span>
      </button>
      <button class="pick" data-go="all">
        <span class="k">02</span>
        <span class="t">전체 목록 훑기 <span aria-hidden="true">→</span></span>
        <span class="d">필터와 정렬을 직접 만지며 전체 매물을 탐색합니다.</span>
      </button>
    </div>

    <p class="stamp">급매는 같은 평형 평균 호가보다 10% 이상, 저렴은 5% 이상 낮은 매물입니다. 같은 평형 매물이 하나뿐이면 비교하지 않습니다.</p>
    <p class="stamp" id="stamp" style="margin-top:6px">데이터 불러오는 중…</p>
    <p class="warn" id="stale" hidden></p>
  </div>
</section>

<!-- ===== 조건 고르기 ===== -->
<section id="vWiz" class="screen">
  <div class="bar"><div class="wrap bar-in">
    <button class="back" id="wBack" aria-label="이전">←</button>
    <div class="steps" id="wSteps"></div>
    <span class="stepno" id="wNo"></span>
  </div></div>
  <div class="wrap wiz">
    <h2 class="q" id="wQ"></h2>
    <p class="qs" id="wQs"></p>
    <div id="wBody"></div>
    <button class="skip" id="wSkip">이 조건은 건너뛰기</button>
  </div>
  <div class="wfoot"><div class="wrap">
    <p class="live" id="wLive"></p>
    <button class="btn btn-ink" id="wNext">다음</button>
  </div></div>
</section>

<!-- ===== 결과 ===== -->
<section id="vList" class="screen">
  <div class="bar"><div class="wrap wide bar-in">
    <button class="back" data-go="home" aria-label="홈">←</button>
    <span class="bar-t" id="lBar">전체 목록</span>
    <button class="bar-a" id="lEdit">조건 다시 고르기</button>
  </div></div>
  <div class="wrap wide">
    <div class="rhead">
      <h1 id="lH1"></h1>
      <p id="lStamp"></p>
      <div class="conds" id="lConds"></div>
    </div>
    <div class="tools">
      <button class="tool" id="tFilter">조건<b id="tBadge" hidden>0</b></button>
      <button class="tool" id="tSort">정렬</button>
      <span class="cnt" id="tCnt"></span>
    </div>
    <div class="list" id="lList"></div>
    <button class="btn btn-line more" id="lMore" hidden>매물 24개 더 보기</button>
  </div>
</section>

<!-- ===== 패널 ===== -->
<div class="veil" id="veil"></div>
<div class="panel" id="panel">
  <div class="p-head"><h2 id="pTitle">조건</h2><button class="back" id="pClose" aria-label="닫기">✕</button></div>
  <div class="p-body" id="pBody"></div>
  <div class="p-foot" id="pFoot" hidden>
    <button class="btn btn-line" id="pReset">초기화</button>
    <button class="btn btn-ink" id="pApply">이 조건으로 보기</button>
  </div>
</div>

<script>
const DATA_URL='report-data.json', META_URL='report-meta.json';
let RAW=[], META=null;

/* ===== 조건 정의: 위저드 스텝과 조건 패널이 같은 정의를 공유 ===== */
const F={
  budget:{label:'매매가',q:'매매가는 어디까지 볼까요?',qs:'상한선을 정해두면 위에 있는 매물은 빼고 보여줍니다',items:[
    {v:'-60000',t:'6억 미만'},{v:'60000-90000',t:'6억 ~ 9억'},{v:'90000-120000',t:'9억 ~ 12억'},
    {v:'120000-150000',t:'12억 ~ 15억'},{v:'150000-200000',t:'15억 ~ 20억'},{v:'200000-',t:'20억 이상'}]},
  pyeong:{label:'평형',q:'몇 평대를 보고 계세요?',qs:'공급면적 기준입니다',items:[
    {v:'20평대',t:'20평대',d:'공급 20~29평'},{v:'30평대',t:'30평대',d:'공급 30~39평'}]},
  age:{label:'연식',q:'준공 연식 조건이 있나요?',qs:'사용승인연도 기준이며, 연식 정보가 없는 매물은 그대로 둡니다',items:[
    {v:'0-5',t:'5년 이내'},{v:'0-10',t:'10년 이내'},{v:'0-20',t:'20년 이내'},
    {v:'0-30',t:'30년 이내'},{v:'31-',t:'30년 초과'}]},
  hseh:{label:'단지 규모',q:'단지 규모 조건이 있나요?',qs:'세대수가 클수록 거래가 잦고 시세 파악이 쉽습니다',items:[
    {v:'300-',t:'300세대 이상'},{v:'500-',t:'500세대 이상'},{v:'1000-',t:'1,000세대 이상'},{v:'2000-',t:'2,000세대 이상'}]},
  floor:{label:'층',q:'층수 조건이 있나요?',qs:'전체 층수 대비 위치로 나눕니다',items:[
    {v:'저',t:'저층'},{v:'중',t:'중층'},{v:'고',t:'고층'}]},
  gap:{label:'평균가 대비',q:'평균가보다 얼마나 싸야 하나요?',qs:'같은 단지에서 면적이 같은 매물들의 평균 호가와 비교합니다',items:[
    {v:'0',t:'평균가 이하'},{v:'5',t:'5% 이상 저렴'},{v:'10',t:'10% 이상 저렴 (급매)'},{v:'15',t:'15% 이상 저렴'}]},
  tags:{label:'매물 특징',q:'꼭 필요한 특징이 있나요?',qs:'고른 특징을 모두 가진 매물만 남깁니다',multi:4,items:[
    {v:'역세권',t:'역세권'},{v:'올수리',t:'올수리'},{v:'대단지',t:'대단지'},{v:'방세개',t:'방 3개'},
    {v:'방네개이상',t:'방 4개 이상'},{v:'화장실두개',t:'화장실 2개'},{v:'테라스',t:'테라스'},
    {v:'필로티',t:'필로티'},{v:'마당',t:'마당'},{v:'세대당1대',t:'세대당 주차 1대'},{v:'탑층',t:'탑층'}]}
};
const SORTS=[
  {v:'gap',t:'평균가 대비 저렴한 순',s:'평균가 대비'},{v:'low',t:'매매가 낮은 순',s:'낮은 가격'},
  {v:'high',t:'매매가 높은 순',s:'높은 가격'},{v:'wide',t:'면적 넓은 순',s:'넓은 면적'},
  {v:'new',t:'준공 최신 순',s:'최신 준공'},{v:'big',t:'단지 큰 순',s:'큰 단지'}];
// 매물 특징 태그는 fin.land 수집분에 들어오지 않는다. 데이터에 있을 때만 조건으로 노출한다.
let HAS_TAGS=false;
const STEPS=()=>['cities','budget','pyeong','age','hseh',...(HAS_TAGS?['tags']:[]),'sort'];
const KEYS=()=>['budget','pyeong','age','hseh','floor','gap',...(HAS_TAGS?['tags']:[])];

const BLANK=()=>({cities:[],budget:'',pyeong:'',age:'',hseh:'',floor:'',gap:'',tags:[],q:''});
const S={view:'home',step:0,c:BLANK(),draft:null,sort:'gap',limit:24,picked:false};
try{const v=JSON.parse(localStorage.getItem('scanner.cond')||'null'); if(v) Object.assign(S.c,v);}catch(e){}

/* ===== 헬퍼 ===== */
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const num=n=>Number(n||0).toLocaleString('ko-KR');
const dong=r=>{const i=String(r??'').indexOf('_');return i>=0?String(r).slice(i+1):String(r??'');};
const link=u=>{const t=String(u??'').trim();return !t?'#':(t.startsWith('/')?'https://m.land.naver.com'+t:t)};
const mapLink=r=>'https://map.naver.com/p/search/'+encodeURIComponent(dong(r.region)+' '+r.title);
const complexLink=r=>r.complexNo?'https://fin.land.naver.com/complexes/'+encodeURIComponent(r.complexNo):'';
const YEAR=new Date().getFullYear();
const within=(v,range)=>{ if(!range) return true; const [lo,hi]=range.split('-');
  if(lo!=='' && v<Number(lo)) return false;
  if(hi!==undefined && hi!=='' && v>Number(hi)) return false; return true; };
const tagsOf=x=>String(x.tagText||'').split(' · ').map(s=>s.trim());
function floorOf(x){ // "고/20" 또는 "4/20" 둘 다 처리
  const [a,b]=String(x.floor||'').split('/');
  if(a==='저'||a==='중'||a==='고') return a;
  const n=Number(a), t=Number(b);
  if(!n||!t) return '';
  if(n<=Math.max(3,t*0.33)) return '저';
  if(n>=t*0.67) return '고';
  return '중';
}

/* ===== 필터 ===== */
function match(c){
  const q=c.q.trim().toLowerCase(), cities=new Set(c.cities);
  return RAW.filter(x=>{
    if(cities.size && !cities.has(x.city)) return false;
    if(c.budget && !within(Number(x.price||0),c.budget)) return false;
    if(c.pyeong && x.pyeongBand!==c.pyeong) return false;
    // 연식·세대수 정보가 비어 있는 매물은 제외하지 않고 통과시킨다 (수집 전 매물이 섞여 있음)
    if(c.age){const y=Number(x.buildYear||0); if(y>0 && !within(YEAR-y,c.age)) return false;}
    if(c.hseh){const h=Number(x.households||0); if(h>0 && !within(h,c.hseh)) return false;}
    if(c.floor && floorOf(x)!==c.floor) return false;
    if(c.gap && Number(x.diffPct||0) > -Number(c.gap)) return false;
    if(c.tags.length){const t=tagsOf(x); if(!c.tags.every(v=>t.includes(v))) return false;}
    if(q && !(String(x.title).toLowerCase().includes(q)||String(x.region).toLowerCase().includes(q)||String(x.featureDesc||'').toLowerCase().includes(q))) return false;
    return true;
  });
}
const ORDER={
  gap:(a,b)=>Number(a.diffPct||0)-Number(b.diffPct||0),
  low:(a,b)=>Number(a.price||0)-Number(b.price||0),
  high:(a,b)=>Number(b.price||0)-Number(a.price||0),
  wide:(a,b)=>Number(b.areaSupplyPyeong||0)-Number(a.areaSupplyPyeong||0),
  new:(a,b)=>Number(b.buildYear||0)-Number(a.buildYear||0),
  big:(a,b)=>Number(b.households||0)-Number(a.households||0)
};

/* ===== 매물 카드 ===== */
function comparable(x){ return Number(x.peerCount||0)>=2; }
function notes(x){
  const out=[], d=Number(x.diffPct||0), y=Number(x.buildYear||0), age=y?YEAR-y:0, t=tagsOf(x);
  const peer=(x.peerAreaText&&x.peerAreaText!=='-'?x.peerAreaText:'같은 평형')+' 매물 '+Number(x.peerCount||0)+'건';
  if(!comparable(x)) out.push(['같은 평형 매물이 이 건뿐이라 평균과 비교하지 않았습니다',1]);
  else if(d<=-5) out.push([peer+' 평균보다 '+Math.abs(d).toFixed(1)+'% 낮습니다',0]);
  else if(d>=5) out.push([peer+' 평균보다 '+d.toFixed(1)+'% 높습니다',1]);
  if(age>=30) out.push(['준공 '+age+'년차 — 수리 상태와 재건축 진행 여부를 확인하세요',1]);
  else if(y && age<=5) out.push(['준공 '+age+'년차 신축입니다',0]);
  if(t.includes('올수리')) out.push(['올수리 매물로 등록돼 있습니다',0]);
  return out.slice(0,2);
}
function itemHtml(x,i){
  const d=Number(x.diffPct||0);
  const flag=x.signal==='급매'?'f-hot':(x.signal==='저렴'?'f-low':'f-mid');
  const g=d<=-1?'minus':(d>=1?'plus':'zero');
  const rank=S.picked&&S.sort==='gap'?'<span class="rk num">'+(i+1)+'</span>':'';
  const spec=(k,v)=>'<div class="spec"><dt>'+k+'</dt><dd class="num">'+esc(v)+'</dd></div>';
  const nt=notes(x).map(([t,warn])=>'<li class="note'+(warn?' caution':'')+'"><s>'+(warn?'!':'·')+'</s>'+esc(t)+'</li>').join('');
  const desc=String(x.featureDesc||'').trim();
  return '<article class="item">'
    +'<div class="i-top"><span class="i-price num">'+esc(x.priceText)+'</span>'
      +(comparable(x)?'<span class="gap '+g+' num">'+(d>0?'+':'')+d.toFixed(1)+'%</span>'
                     :'<span class="gap zero">비교 대상 없음</span>')
      +'<span class="flag '+flag+'">'+esc(x.signal)+'</span></div>'
    +'<h3 class="i-name">'+rank+esc(x.title)+'</h3>'
    +'<p class="i-where">'+esc(x.city)+' · '+esc(dong(x.region))+'</p>'
    +'<dl class="specs">'
      +spec('공급/전용',x.areaSupplyPyeongText+'/'+x.areaExclusivePyeongText+'평')
      +spec('층',x.floor||'-')
      +spec('세대수',x.householdsText||'-')
      +spec('준공',x.buildYearText||'-')
      +'<div class="spec wide"><dt>'+esc(x.peerAreaText&&x.peerAreaText!=='-'?x.peerAreaText+' 평균':'같은 평형 평균')+'</dt>'+'<dd class="num">'+esc(x.avgPriceText||'-')+(comparable(x)?' <span class="dim">('+num(x.peerCount)+'건)</span>':'')+'</dd></div>'
      +(HAS_TAGS?spec('특징',(tagsOf(x)[0]||'-')):'')
    +'</dl>'
    +(nt?'<ul class="notes">'+nt+'</ul>':'')
    +(desc&&desc!=='-'?'<p class="desc">“'+esc(desc)+'”</p>':'')
    +'<div class="acts"><a class="a1" href="'+esc(link(x.url))+'" target="_blank" rel="noopener">매물 보기</a>'
    +(complexLink(x)?'<a class="a2" href="'+esc(complexLink(x))+'" target="_blank" rel="noopener">단지</a>':'')
    +'<a class="a2" href="'+esc(mapLink(x))+'" target="_blank" rel="noopener">지도</a></div>'
  +'</article>';
}

/* ===== 결과 화면 ===== */
function condLabels(c){
  const out=[];
  if(c.cities.length) out.push(c.cities.length<=2?c.cities.join(', '):c.cities[0]+' 외 '+(c.cities.length-1)+'곳');
  KEYS().forEach(k=>{
    if(k==='tags') return;
    const o=F[k].items.find(i=>i.v===c[k]); if(o) out.push(o.t);
  });
  c.tags.forEach(v=>{const o=F.tags.items.find(i=>i.v===v); out.push(o?o.t:v);});
  if(c.q.trim()) out.push('검색: '+c.q.trim());
  return out;
}
function activeCount(c){
  return (c.cities.length?1:0)+KEYS().filter(k=>k!=='tags'&&c[k]).length+c.tags.length+(c.q.trim()?1:0);
}
function render(){
  const list=match(S.c).sort(ORDER[S.sort]||ORDER.gap);
  const shown=list.slice(0,S.limit);
  document.getElementById('lH1').innerHTML = S.picked
    ? '고른 조건에 맞는 매물 <b class="num">'+num(list.length)+'건</b>'
    : '수집된 전체 매물 <b class="num">'+num(list.length)+'건</b>';
  document.getElementById('lStamp').textContent = stampText()+(staleText()?' · '+staleText():'');
  document.getElementById('lConds').innerHTML = condLabels(S.c).map(t=>'<span class="cond">'+esc(t)+'</span>').join('');
  document.getElementById('tCnt').textContent = list.length?num(Math.min(S.limit,list.length))+' / '+num(list.length):'';
  document.getElementById('lList').innerHTML = shown.length ? shown.map(itemHtml).join('')
    : '<div class="none">조건에 맞는 매물이 없습니다.<br>조건 중 한두 개를 풀어보세요.</div>';
  document.getElementById('lMore').hidden = shown.length>=list.length;
  const n=activeCount(S.c), badge=document.getElementById('tBadge');
  badge.hidden=!n; badge.textContent=n;
  document.getElementById('tSort').textContent='정렬 · '+(SORTS.find(s=>s.v===S.sort)||SORTS[0]).s;
  document.getElementById('lBar').textContent=S.picked?'내 조건 결과':'전체 목록';
}
function stampText(){
  return META&&META.dataLabel ? META.dataLabel+' 수집분 기준' : '수집 시각 정보 없음';
}
function staleDays(){ // 수집 시각(KST, 타임존 표기 없음)을 KST로 읽어 며칠 지났는지 계산
  const at=META&&META.dataAt; if(!at) return 0;
  const t=Date.parse(at.slice(0,19)+'+09:00'); if(!t) return 0;
  return Math.floor((Date.now()-t)/86400000);
}
function staleText(){
  const d=staleDays();
  return d>=3 ? '수집한 지 '+d+'일 지난 데이터라, 이미 거래됐거나 내려간 매물이 섞여 있습니다. 매물 상세가 열리지 않으면 단지 페이지에서 현재 매물을 확인하세요.' : '';
}
function show(v){
  S.view=v;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('on'));
  document.getElementById(v==='home'?'vHome':v==='wizard'?'vWiz':'vList').classList.add('on');
  window.scrollTo(0,0);
}
function toList(picked){
  S.picked=picked; S.limit=24; S.sort=picked?'gap':'low';
  localStorage.setItem('scanner.cond',JSON.stringify(S.c));
  show('list'); render();
}

/* ===== 조건 고르기(위저드) ===== */
function cityList(){
  const cities=[...new Set(RAW.map(x=>x.city))].sort((a,b)=>a.localeCompare(b,'ko'));
  const groups=[...new Set(cities.map(c=>c.slice(0,2)).filter(g=>cities.filter(c=>c.startsWith(g)).length>1))];
  return {cities,groups};
}
function drawWiz(){
  const key=STEPS()[S.step];
  document.getElementById('wSteps').innerHTML=STEPS().map((_,i)=>'<i class="'+(i<=S.step?'done':'')+'"></i>').join('');
  document.getElementById('wNo').textContent=(S.step+1)+' / '+STEPS().length;
  const body=document.getElementById('wBody');
  if(key==='cities'){
    document.getElementById('wQ').textContent='어느 지역 매물을 볼까요?';
    document.getElementById('wQs').textContent='여러 지역을 함께 고를 수 있습니다';
    const {cities,groups}=cityList();
    body.innerHTML='<p class="sub">한 번에 고르기</p><div class="tags">'
      +groups.map(g=>{const all=cities.filter(c=>c.startsWith(g));
        return '<button class="tag '+(all.every(c=>S.c.cities.includes(c))?'on':'')+'" data-grp="'+esc(g)+'">'+esc(g)+' 전체</button>';}).join('')
      +'</div><p class="sub">지역별</p><div class="tags">'
      +cities.map(c=>'<button class="tag '+(S.c.cities.includes(c)?'on':'')+'" data-city="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>';
  }else if(key==='sort'){
    document.getElementById('wQ').textContent='결과를 어떤 순서로 볼까요?';
    document.getElementById('wQs').textContent='나중에 결과 화면에서 바꿀 수 있습니다';
    body.innerHTML='<div class="rows">'+SORTS.map(s=>
      '<button class="row '+(S.sort===s.v?'on':'')+'" data-sort="'+s.v+'"><div class="body"><div class="t">'+s.t+'</div></div>'
      +'<span class="box">'+(S.sort===s.v?'✓':'')+'</span></button>').join('')+'</div>';
  }else if(key==='tags'){
    const o=F.tags;
    document.getElementById('wQ').textContent=o.q;
    document.getElementById('wQs').textContent=o.qs;
    body.innerHTML='<div class="tags">'+o.items.map(it=>
      '<button class="tag '+(S.c.tags.includes(it.v)?'on':'')+'" data-opt="'+esc(it.v)+'">'+esc(it.t)+'</button>').join('')+'</div>';
  }else{
    const o=F[key], cur=S.c[key];
    document.getElementById('wQ').textContent=o.q;
    document.getElementById('wQs').textContent=o.qs;
    body.innerHTML='<div class="rows">'+o.items.map(it=>
      '<button class="row '+(cur===it.v?'on':'')+'" data-opt="'+esc(it.v)+'"><div class="body"><div class="t">'+esc(it.t)+'</div>'
      +(it.d?'<div class="d">'+esc(it.d)+'</div>':'')+'</div><span class="box">'+(cur===it.v?'✓':'')+'</span></button>').join('')+'</div>';
  }
  const last=S.step===STEPS().length-1;
  document.getElementById('wNext').textContent=last?'결과 보기':'다음';
  document.getElementById('wLive').innerHTML=RAW.length?'지금 조건이면 <b class="num">'+num(match(S.c).length)+'건</b>':'';
}
function next(){ if(S.step<STEPS().length-1){S.step++;drawWiz();window.scrollTo(0,0);} else toList(true); }
document.getElementById('wBody').addEventListener('click',e=>{
  const key=STEPS()[S.step];
  const city=e.target.closest('[data-city]'), grp=e.target.closest('[data-grp]'),
        opt=e.target.closest('[data-opt]'), srt=e.target.closest('[data-sort]');
  if(city){const v=city.dataset.city,a=S.c.cities,i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);drawWiz();return;}
  if(grp){
    const all=cityList().cities.filter(c=>c.startsWith(grp.dataset.grp));
    const every=all.every(c=>S.c.cities.includes(c));
    S.c.cities=every?S.c.cities.filter(c=>!all.includes(c)):[...new Set([...S.c.cities,...all])];
    drawWiz();return;
  }
  if(srt){S.sort=srt.dataset.sort;drawWiz();return;}
  if(opt){
    const v=opt.dataset.opt;
    if(key==='tags'){
      const a=S.c.tags,i=a.indexOf(v);
      if(i>=0)a.splice(i,1); else {a.push(v); if(a.length>F.tags.multi)a.shift();}
      drawWiz();
    }else{
      S.c[key]=(S.c[key]===v?'':v); drawWiz();
      if(S.c[key]) setTimeout(next,170); // 한 개만 고르는 질문은 바로 다음으로
    }
  }
});
document.getElementById('wNext').addEventListener('click',next);
document.getElementById('wSkip').addEventListener('click',()=>{
  const key=STEPS()[S.step];
  if(key==='cities') S.c.cities=[]; else if(key==='tags') S.c.tags=[]; else if(key!=='sort') S.c[key]='';
  next();
});
document.getElementById('wBack').addEventListener('click',()=>{ S.step?(S.step--,drawWiz()):show('home'); });

/* ===== 조건 패널 / 정렬 패널 ===== */
const panel=document.getElementById('panel'), veil=document.getElementById('veil');
function closePanel(){panel.classList.remove('on');veil.classList.remove('on');document.body.style.overflow='';}
function openPanel(){panel.classList.add('on');veil.classList.add('on');document.body.style.overflow='hidden';}
veil.addEventListener('click',closePanel);
document.getElementById('pClose').addEventListener('click',closePanel);

function drawPanel(scroll){
  const d=S.draft, {cities,groups}=cityList();
  const grp=(t,inner)=>'<div class="grp"><h3>'+t+'</h3>'+inner+'</div>';
  const tags=(items,k,on)=>'<div class="tags">'+items.map(it=>
    '<button class="tag '+(on(it.v)?'on':'')+'" data-k="'+k+'" data-v="'+esc(it.v)+'">'+esc(it.t)+'</button>').join('')+'</div>';
  const body=document.getElementById('pBody');
  body.innerHTML=
     grp('단지·동 검색','<input class="find" id="pq" placeholder="예: 래미안, 공덕동" value="'+esc(d.q)+'">')
    +grp('지역', tags(groups.map(g=>({v:'@'+g,t:g+' 전체'})),'cities',v=>cities.filter(c=>c.startsWith(v.slice(1))).every(c=>d.cities.includes(c)))
                +tags(cities.map(c=>({v:c,t:c})),'cities',v=>d.cities.includes(v)))
    +KEYS().map(k=>grp(F[k].label, tags(F[k].items,k, k==='tags'?(v=>d.tags.includes(v)):(v=>d[k]===v)))).join('');
  if(scroll) body.scrollTop=scroll;
}
function openFilter(){
  S.draft=JSON.parse(JSON.stringify(S.c));
  document.getElementById('pTitle').textContent='조건 고르기';
  document.getElementById('pFoot').hidden=false;
  drawPanel(0); openPanel();
}
function openSort(){
  document.getElementById('pTitle').textContent='정렬';
  document.getElementById('pFoot').hidden=true;
  document.getElementById('pBody').innerHTML='<div class="rows" style="margin:6px 0 18px">'+SORTS.map(s=>
    '<button class="row '+(S.sort===s.v?'on':'')+'" data-sort="'+s.v+'"><div class="body"><div class="t">'+s.t+'</div></div>'
    +'<span class="box">'+(S.sort===s.v?'✓':'')+'</span></button>').join('')+'</div>';
  openPanel();
}
document.getElementById('pBody').addEventListener('click',e=>{
  const srt=e.target.closest('[data-sort]');
  if(srt){S.sort=srt.dataset.sort;S.limit=24;closePanel();render();return;}
  const chip=e.target.closest('[data-k]');
  if(!chip) return;
  const k=chip.dataset.k, v=chip.dataset.v, d=S.draft;
  const q=document.getElementById('pq'); if(q) d.q=q.value; // 다시 그리기 전에 입력값 보존
  if(k==='cities'){
    if(v.startsWith('@')){
      const all=cityList().cities.filter(c=>c.startsWith(v.slice(1)));
      const every=all.every(c=>d.cities.includes(c));
      d.cities=every?d.cities.filter(c=>!all.includes(c)):[...new Set([...d.cities,...all])];
    }else{const i=d.cities.indexOf(v); i>=0?d.cities.splice(i,1):d.cities.push(v);}
  }else if(k==='tags'){
    const i=d.tags.indexOf(v); if(i>=0)d.tags.splice(i,1); else {d.tags.push(v); if(d.tags.length>F.tags.multi)d.tags.shift();}
  }else d[k]=(d[k]===v?'':v);
  drawPanel(document.getElementById('pBody').scrollTop);
});
document.getElementById('pApply').addEventListener('click',()=>{
  const q=document.getElementById('pq'); if(q) S.draft.q=q.value;
  S.c=S.draft; S.limit=24;
  localStorage.setItem('scanner.cond',JSON.stringify(S.c));
  closePanel(); render();
});
document.getElementById('pReset').addEventListener('click',()=>{S.draft=BLANK();drawPanel(0);});
document.getElementById('tFilter').addEventListener('click',openFilter);
document.getElementById('tSort').addEventListener('click',openSort);
document.getElementById('lMore').addEventListener('click',()=>{S.limit+=24;render();});
document.getElementById('lEdit').addEventListener('click',()=>{S.step=0;show('wizard');drawWiz();});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{
  const go=b.dataset.go;
  if(go==='home') show('home');
  else if(go==='wizard'){S.step=0;show('wizard');drawWiz();}
  else {S.c=BLANK();toList(false);}
}));
window.addEventListener('scroll',()=>{
  const on=window.scrollY>4;
  document.querySelectorAll('.bar').forEach(b=>b.classList.toggle('edge',on));
},{passive:true});

async function init(){
  document.getElementById('lList').innerHTML='<div class="load"></div>'.repeat(6);
  try{
    const [dr,mr]=await Promise.all([fetch(DATA_URL,{cache:'no-store'}),fetch(META_URL,{cache:'no-store'}).catch(()=>null)]);
    if(!dr.ok) throw new Error('HTTP '+dr.status);
    RAW=await dr.json(); if(!Array.isArray(RAW)) RAW=[];
    if(mr&&mr.ok) META=await mr.json().catch(()=>null);
    HAS_TAGS=RAW.some(x=>x.tagText&&x.tagText!=='-');
    const hot=RAW.filter(x=>x.signal==='급매').length, low=RAW.filter(x=>x.signal==='저렴').length;
    document.getElementById('fTotal').textContent=num(RAW.length);
    document.getElementById('fHot').textContent=num(hot);
    document.getElementById('fLow').textContent=num(low);
    document.getElementById('stamp').textContent=stampText()+' · 판매중인 20~30평대 매물만 담았습니다.';
    const st=staleText(); const el=document.getElementById('stale');
    el.textContent=st; el.hidden=!st;
    if(S.view==='list') render(); if(S.view==='wizard') drawWiz();
  }catch(err){
    console.error('load failed',err);
    document.getElementById('stamp').textContent='데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
    document.getElementById('lList').innerHTML='<div class="none">데이터를 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</div>';
  }
}
init();
</script>
