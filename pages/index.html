<html lang="ko">
<head>
  <meta charset="utf-8" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="APT Listings Report" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="오늘의 아파트 매물 리포트" />
  <meta property="og:description" content="급매/저렴 분석과 지역별 필터를 한눈에 보는 아파트 매물 대시보드" />
  <meta property="og:url" content="https://saechimdaeki.github.io/apt-price-tracker/" />

  <meta name="twitter:title" content="오늘의 아파트 매물 리포트" />
  <meta name="twitter:description" content="급매/저렴 분석과 지역별 필터를 한눈에 보는 아파트 매물 대시보드" />
  <meta name="twitter:image" content="https://saechimdaeki.github.io/apt-price-tracker/assets/og-cover.png" />
  <style>
    :root {
      --bg: #edf3fb;
      --line: #d7e2f0;
      --line-strong: #c5d4e8;
      --text: #0f172a;
      --muted: #64748b;
      --card: #ffffff;
      --card-soft: #f8fbff;
      --brand: #0f172a;
      --shadow: 0 10px 28px rgba(30, 41, 59, .08);
      --glow-a: rgba(37,99,235,.24);
      --glow-b: rgba(34,197,94,.20);
      --hero-a: #0f4a8a;
      --hero-b: #0ea5a1;
    }
    *{box-sizing:border-box}

    body {
      margin: 0;
      padding: 14px clamp(12px, 1.4vw, 28px) 40px;
      color: var(--text);
      font-size: 17px;
      background: radial-gradient(circle at 18% -12%, #dbeafe 0, transparent 36%),
      radial-gradient(circle at 92% 2%, #dcfce7 0, transparent 33%),
      linear-gradient(180deg, #f7fbff 0%, var(--bg) 38%, #e8f0fa 100%),
      repeating-linear-gradient(135deg, rgba(15,23,42,.015) 0 1px, transparent 1px 12px),
      conic-gradient(from 200deg at 8% 88%, rgba(2,132,199,.08), transparent 28%, rgba(16,185,129,.08) 52%, transparent 76%);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      pointer-events: none;
      z-index: -2;
      filter: blur(10px);
      opacity: .9;
    }

    body::before {
      left: -140px;
      top: 12vh;
      width: 420px;
      height: 520px;
      border-radius: 120px;
      background:
        linear-gradient(180deg, rgba(37,99,235,.18) 0%, rgba(14,165,233,.08) 100%),
        repeating-linear-gradient(180deg, rgba(255,255,255,.28) 0 2px, transparent 2px 18px);
      transform: rotate(-8deg);
    }

    body::after {
      right: -120px;
      bottom: 8vh;
      width: 380px;
      height: 420px;
      border-radius: 50px;
      background:
        radial-gradient(circle at 30% 30%, rgba(34,197,94,.24) 0%, transparent 38%),
        linear-gradient(180deg, rgba(15,23,42,.12) 0%, rgba(14,165,161,.14) 100%);
      transform: rotate(12deg);
    }

    .wrap {
      width: min(2200px, calc(100vw - 24px));
      max-width: none;
      margin: 0 auto;
      position: relative
    }

    .wrap::before {
      content: "";
      position: fixed;
      right: -140px;
      bottom: -120px;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-a) 0%, rgba(37,99,235,0) 70%);
      pointer-events: none;
      z-index: -1
    }

    .wrap::after {
      content: "";
      position: fixed;
      left: 52%;
      top: 84px;
      width: min(42vw, 760px);
      height: 180px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(59,130,246,.08) 0%, rgba(255,255,255,0) 50%, rgba(16,185,129,.10) 100%);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -1;
      filter: blur(12px);
    }

    .top-banner {
      border: 1px solid #cfe0f5;
      border-radius: 28px;
      background:
        linear-gradient(120deg, rgba(255,255,255,.98) 0%, rgba(239,247,255,.95) 48%, rgba(235,252,246,.93) 100%),
        repeating-linear-gradient(90deg, rgba(148,163,184,.06) 0 1px, transparent 1px 20px);
      box-shadow: 0 26px 60px rgba(15,23,42,.16);
      padding: 26px 26px 20px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden
    }

    .top-banner::before {
      content: "";
      position: absolute;
      left: -90px;
      top: -120px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-b) 0%, rgba(34,197,94,0) 72%);
      pointer-events: none
    }
    .top-banner::after {
      content: "";
      position: absolute;
      right: -120px;
      top: -110px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14,165,233,.22) 0%, rgba(14,165,233,0) 72%);
      pointer-events: none
    }

    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: relative
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(42px, 3.3vw, 62px);
      letter-spacing: -.03em;
      font-weight: 900;
      background: linear-gradient(120deg,#0f172a 0%, var(--hero-a) 40%, var(--hero-b) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block
    }

    .meta {
      color: #1e3a5f;
      margin: 0 0 14px;
      font-weight: 800;
      background: rgba(255,255,255,.72);
      border: 1px solid #c9dbf2;
      border-radius: 999px;
      padding: 11px 16px;
      display: inline-flex;
      gap: 8px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 18px rgba(30,58,95,.10);
      font-size: 18px
    }

    .legend {
      margin: 6px 0 0;
      padding: 15px 18px;
      border: 1px solid #d3e4f6;
      border-left: 6px solid #0ea5a1;
      border-radius: 16px;
      background: linear-gradient(90deg,#f1faf8 0%,#f4f9ff 48%,#fffef8 100%);
      color: #334155;
      font-size: 15px;
      font-weight: 700
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 12px 0 18px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(248,251,255,.92) 0%, rgba(242,247,255,.92) 100%);
      border: 1px solid var(--line-strong);
      border-radius: 24px;
      box-shadow: 0 20px 46px rgba(15,23,42,.12);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .controls:hover {
      box-shadow: 0 20px 44px rgba(30,41,59,.18)
    }
    .controls::after {
      content: "";
      position: absolute;
      right: -80px;
      top: -80px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle,#dbeafe 0%,transparent 70%);
      pointer-events: none
    }

    .hidden-state {
      display: none
    }

    .controls-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .controls-title {
      font-size: 15px;
      font-weight: 800;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .controls-summary {
      display: inline-flex;
      align-items: center;
      border: 1px solid #c7d5e8;
      background: #f5f9ff;
      color: #1e3a8a;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800;
    }
    .controls-toggle {
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      padding: 8px 14px;
      background: linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
      color: #334155;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .controls-toggle:hover {
      background: #eef5ff;
      border-color: #8fb0d8;
    }
    .controls-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .controls.collapsed .controls-body {
      display: none;
    }

    .filter-mini {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px 8px 16px;
      border: 1px solid #c5d4e8;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(8px);
      box-shadow: 0 14px 34px rgba(15,23,42,.22);
      font-size: 13px;
      font-weight: 800;
      color: #334155;
      max-width: calc(100vw - 24px);
      white-space: nowrap;
    }
    .filter-mini[hidden] { display: none }
    .filter-mini .fm-sep { color: #cbd5e1 }
    .filter-mini .fm-btn {
      border: 1px solid #0f172a;
      background: #0f172a;
      color: #fff;
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .filter-mini .fm-btn:hover { filter: brightness(1.15) }

    .quick-grid {
      display: grid;
      grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
      gap: 16px
    }

    .quick-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, .08);
      position: relative;
      overflow: hidden;
      transition: transform .16s ease, box-shadow .16s ease
    }
    .quick-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(15,23,42,.14)
    }
    .quick-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg,#2563eb 0%,#0ea5e9 48%,#22c55e 100%)
    }
    .quick-card::after {
      content: "";
      position: absolute;
      right: -20px;
      bottom: -36px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(14,165,233,.18) 0%, rgba(14,165,233,0) 72%);
      pointer-events: none
    }
    .quick-card:nth-child(1){
      background: linear-gradient(180deg,#ffffff 0%,#f2f7ff 100%);
      border-color:#cfe0fa;
    }
    .quick-card:nth-child(2){
      background: linear-gradient(180deg,#ffffff 0%,#effcf6 100%);
      border-color:#cdebdc;
    }

    .filter-panel {
      background: linear-gradient(180deg, #ffffff 0%, #f9fcff 100%);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, .08);
      position: relative;
      overflow: hidden
    }
    .filter-panel::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg,#0f172a 0%,#334155 52%,#64748b 100%)
    }

    .filter-title {
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 0
    }

    .filter-panel-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px
    }

    .filter-auto-note{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid #bfdbfe;
      background:linear-gradient(180deg,#f8fbff 0%,#eef6ff 100%);
      color:#1d4ed8;
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap
    }

    .filter-row {
      display: grid;
      grid-template-columns:repeat(6, minmax(0, 1fr)) 1.4fr 130px;
      gap: 8px
    }

    .filter-row input, .filter-row select, .filter-row button {
      border: 1px solid #cfd8e6;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      background: linear-gradient(180deg,#fff 0%,#fdfefe 100%);
      box-shadow: 0 1px 0 rgba(15,23,42,.02) inset;
    }
    .filter-row input:focus, .filter-row select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15)
    }

    .filter-row button {
      cursor: pointer;
      font-weight: 800;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .filter-row button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(15, 23, 42, .12)
    }

    .reset-btn{
      background:linear-gradient(180deg,#ffffff 0%,#f8fafc 100%);
      color:#475569;
      border-color:#cbd5e1;
      box-shadow:none;
    }

    .reset-btn:hover{
      background:linear-gradient(180deg,#fff7f7 0%,#fef2f2 100%);
      border-color:#fda4af;
      color:#be123c;
    }

    .reset-btn::before{
      content:"↺";
      margin-right:6px;
      font-weight:900;
    }

    #city, #region {
      display: none !important;
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      opacity: 0 !important;
      pointer-events: none !important;
      z-index: -1 !important;
    }

    .city-quick, .region-quick {
      display: block
    }

    .city-quick-title, .region-quick-title {
      font-size: 14px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px
    }
    .quick-count {
      display: inline-flex;
      align-items: center;
      border: 1px solid #c7d5e8;
      background: #f5f9ff;
      color: #1e3a8a;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      font-weight: 800
    }

    .city-quick-list, .region-quick-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-right: 2px;
      overflow-x: hidden
    }

    .city-quick-list {
      max-height: none;
      overflow-y: visible
    }

    .region-quick-list {
      max-height: none;
      overflow-y: visible
    }

    .city-chip, .region-chip {
      border: 1px solid #c7d5e8;
      border-radius: 999px;
      padding: 9px 14px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      color: #334155;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .14s ease;
      box-shadow: 0 1px 0 rgba(255,255,255,.9) inset;
    }

    .city-chip:hover, .region-chip:hover {
      background: #eef5ff;
      border-color: #8fb0d8;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 20px rgba(37,99,235,.14)
    }

    .city-chip.active,
    .region-chip.active {
      background: linear-gradient(120deg,#0f172a 0%,#1d4ed8 58%,#0ea5a1 100%);
      border-color: #0f172a;
      color: #fff;
      box-shadow: 0 12px 22px rgba(15, 23, 42, .30)
    }
    .active-filters{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      padding:10px 12px;
      border:1px dashed #b9cbe3;
      border-radius:12px;
      background:linear-gradient(90deg,#f8fbff 0%,#f3f8ff 60%,#f6fffb 100%)
    }
    .af-title{
      font-size:14px;
      font-weight:800;
      color:#334155;
      white-space:nowrap
    }
    .af-list{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      flex:1
    }
    .af-chip{
      border:1px solid #bfd0e6;
      border-radius:999px;
      background:#fff;
      color:#0f172a;
      font-size:14px;
      font-weight:700;
      padding:6px 11px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      transition:all .12s ease
    }
    .af-chip:hover{
      background:#eff6ff;
      border-color:#8fb0d8;
      transform:translateY(-1px)
    }
    .af-chip .x{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:16px;
      height:16px;
      border-radius:999px;
      background:#e2e8f0;
      color:#334155;
      font-size:11px;
      line-height:1
    }
    .af-clear-all{
      border:1px solid #0f172a;
      background:#0f172a;
      color:#fff;
      border-radius:999px;
      padding:8px 12px;
      font-size:13px;
      font-weight:800;
      cursor:pointer
    }
    .af-clear-all:hover{filter:brightness(1.05)}

    .city-quick-list::-webkit-scrollbar, .region-quick-list::-webkit-scrollbar {
      height: 8px;
      width: 8px
    }

    .city-quick-list::-webkit-scrollbar-thumb, .region-quick-list::-webkit-scrollbar-thumb {
      background: #c7d4e6;
      border-radius: 999px
    }

    .city-quick-list::-webkit-scrollbar-track, .region-quick-list::-webkit-scrollbar-track {
      background: #eff5fc;
      border-radius: 999px
    }
    .stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px;margin:18px 0 20px;perspective:1000px}

    .stat {
      background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 14px 12px;
      box-shadow: 0 14px 26px rgba(15,23,42,.08);
      position: relative;
      overflow: hidden;
      transition: transform .15s ease, box-shadow .15s ease
    }
    .stat:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(15,23,42,.12)}
    .stat::before{
      content:"";
      position:absolute;
      left:0;
      top:0;
      width:100%;
      height:3px;
      background:linear-gradient(90deg,#1d4ed8 0%,#0ea5e9 60%,#22c55e 100%)
    }
    .stat:nth-child(2)::before{background:linear-gradient(90deg,#2563eb 0%,#14b8a6 100%)}
    .stat:nth-child(3)::before{background:linear-gradient(90deg,#e11d48 0%,#f97316 100%)}
    .stat:nth-child(4)::before{background:linear-gradient(90deg,#0ea5a4 0%,#06b6d4 100%)}
    .stat:nth-child(5)::before{background:linear-gradient(90deg,#6366f1 0%,#22c55e 100%)}
    .stat:nth-child(6)::before{background:linear-gradient(90deg,#f59e0b 0%,#f97316 100%)}
    .stat:nth-child(7)::before{background:linear-gradient(90deg,#475569 0%,#0f172a 100%)}
    .stat .k{font-size:14px;color:#64748b;font-weight:700}
    .stat .v{font-size:40px;line-height:1.05;font-weight:900;letter-spacing:-.02em}
    .stat:nth-child(1) .v{color:#0f172a}
    .stat:nth-child(2) .v{color:#1d4ed8}
    .stat:nth-child(3) .v{color:#dc2626}
    .stat:nth-child(4) .v{color:#0e7490}
    .stat:nth-child(5) .v{color:#0891b2}
    .stat:nth-child(6) .v{color:#b45309}
    .stat:nth-child(7) .v{color:#374151}
    .region{
      --accent:#475569;
      background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
      border:1px solid #d8e3f2;
      border-left:6px solid var(--accent);
      border-radius:22px;
      margin-bottom:18px;
      overflow:hidden;
      box-shadow:0 18px 36px rgba(15,23,42,.10);
      transition: box-shadow .16s ease, transform .16s ease;
      opacity: 1;
      transform: none;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:14px 16px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(90deg,rgba(37,99,235,.18) 0%,rgba(255,255,255,.98) 58%, rgba(236,253,245,.95) 100%);
      cursor:pointer
    }
    .head:hover{background:linear-gradient(90deg,rgba(37,99,235,.24) 0%,rgba(255,255,255,1) 58%, rgba(236,253,245,1) 100%)}
    .head:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}
    .title-wrap{display:flex;align-items:center;gap:8px}
    .collapse-caret{display:inline-flex;width:18px;justify-content:center;color:#334155;font-weight:900}
    .collapse-label{font-size:12px;color:#64748b;font-weight:700}
    .region.collapsed .head{border-bottom:0}
    .title{font-size:32px;font-weight:900;letter-spacing:-.02em}
    .chips{display:flex;gap:6px;flex-wrap:wrap}

    }

    }

    @media (max-width: 1536px) {

    @media (max-width:900px){
      body{padding:12px}

      .top-banner{

      }

      }

      .quick-grid {

      }

      }

        max-height: 122px;
        overflow-y: auto
      }

      .region-quick-list {
        max-height: 168px;
        overflow-y: auto
      }

        padding:8px;
        gap:8px
      }
      .af-title{
        width:100%
      }
      .af-clear-all{
        width:100%;
        border-radius:10px
      }
      .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
      .stat{padding:10px}
      .stat .v{font-size:22px}
      .head{flex-direction:column;align-items:flex-start}
      .title-wrap{width:100%}
      .table-wrap{overflow-x:visible}
      table{min-width:0}
      table, thead, tbody, tr, th, td{display:block;width:100%}
      thead{display:none}
      tbody{padding:8px}
      tr{background:#fff;border:1px solid #e5eaf3;border-radius:12px;padding:8px;margin-bottom:10px}
      td{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border:0;border-bottom:1px dashed #edf1f7;padding:6px 2px;white-space:normal}
      td:last-child{border-bottom:0}
      td::before{content:attr(data-label);min-width:84px;flex:0 0 84px;color:#64748b;font-weight:700}
      td.price{white-space:normal}
      td.dim{white-space:normal}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="top-banner">
      <div class="title-row">
        <h1>오늘의 아파트 매물 리포트</h1>
        <div class="meta">기준시각: 2026-04-21 16:08 KST / 노출 매물 37182건 / 필터: 없음</div>
      </div>
      <div class="legend">평균대비 = (매물가 - 단지평균가) / 단지평균가 × 100 · 급매: -10.0% 이하 · 저렴: -5.0% 이하</div>
    </section>

    <div class="controls" id="controlsPanel">
      <div class="controls-head">
        <div class="controls-title">검색 · 필터 <span class="controls-summary" id="controlsSummary">필터 없음</span></div>
        <button type="button" id="controlsToggle" class="controls-toggle" aria-expanded="true" aria-controls="controlsBody">필터 접기 ▴</button>
      </div>
      <div class="controls-body" id="controlsBody">
      <div class="hidden-state">
        <select id="city" hidden aria-hidden="true" tabindex="-1"></select>
        <select id="region" hidden aria-hidden="true" tabindex="-1"></select>
      </div>
      <div class="quick-grid">
        <section class="quick-card">
          <div id="cityQuick" class="city-quick"></div>
        </section>
        <section class="quick-card">
          <div id="regionQuick" class="region-quick"></div>
        </section>
      </div>
      <section class="filter-panel">
        <div class="filter-panel-head">
          <div class="filter-title">상세 필터</div>
          <div class="filter-auto-note">변경 즉시 자동 적용</div>
        </div>
        <div class="filter-row">
          <select id="priceBand">
            <option value="">가격대(전체)</option>
            <option>8억 미만</option>
            <option>8~9억대</option>
            <option>9~10억대</option>
            <option>10~12억대</option>
            <option>12억 이상</option>
          </select>
          <select id="pyeongBand">
            <option value="">평형(공급면적 기준,전체)</option>
            <option>20평대</option>
            <option>30평대</option>
          </select>
          <select id="hsehBand">
            <option value="">세대수(전체)</option>
            <option value="0-299">300세대 미만</option>
            <option value="300-499">300~500세대</option>
            <option value="500-999">500~1000세대</option>
            <option value="1000-">1000세대 이상</option>
          </select>
          <select id="ageBand">
            <option value="">연식(전체)</option>
            <option value="0-5">5년 이내</option>
            <option value="6-10">6~10년</option>
            <option value="11-20">11~20년</option>
            <option value="21-30">21~30년</option>
            <option value="31-">30년 초과</option>
          </select>
          <select id="signal">
            <option value="">판단(전체)</option>
            <option>급매</option>
            <option>저렴</option>
            <option>보통</option>
          </select>
          <select id="status">
            <option value="">상태(전체)</option>
            <option>판매중</option>
            <option>다시 등록된 매물(판매중)</option>
          </select>
          <input id="q" placeholder="지역/단지명 검색"/>
          <button id="resetBtn" class="reset-btn" type="button" title="모든 필터를 한 번에 지웁니다">전체 초기화</button>
        </div>
      </section>
      <div id="activeFilterBar" class="active-filters" hidden></div>
      </div>
    </div>

    <div id="filterMiniBar" class="filter-mini" hidden>
      <span id="fmTotal">노출 0건</span>
      <span class="fm-sep">·</span>
      <span id="fmFilters">필터 없음</span>
      <button type="button" id="fmOpenBtn" class="fm-btn">필터 열기 ↑</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="k">노출 매물</div><div class="v" id="sTotal">0</div></div>
      <div class="stat"><div class="k">지역 수</div><div class="v" id="sRegions">0</div></div>
      <div class="stat"><div class="k">급매</div><div class="v" id="sBargain">0</div></div>
      <div class="stat"><div class="k">저렴</div><div class="v" id="sCheap">0</div></div>
      <div class="stat"><div class="k">다시 등록된 매물(판매중)</div><div class="v" id="sRelisted">0</div></div>
      <div class="stat"><div class="k">거래종결 후보</div><div class="v">9341</div></div>
      <div class="stat"><div class="k">거래종결 추정</div><div class="v">36721</div></div>
    </div>

    <div id="regions"></div>
  </div>

  <script>
    let RAW = [];
    const DATA_URL = 'report-data.json';
    const cityEl = document.getElementById('city'), regionEl = document.getElementById('region'),
            priceEl = document.getElementById('priceBand'), pyeongEl = document.getElementById('pyeongBand'),
            hsehEl = document.getElementById('hsehBand'), ageEl = document.getElementById('ageBand'),
            signalEl = document.getElementById('signal'), statusEl = document.getElementById('status'),
            qEl = document.getElementById('q'), regionsEl = document.getElementById('regions'),
            cityQuickEl = document.getElementById('cityQuick'), regionQuickEl = document.getElementById('regionQuick');
    const activeFilterBar = document.getElementById('activeFilterBar');
    const resetBtn=document.getElementById('resetBtn');
    const controlsPanel=document.getElementById('controlsPanel');
    const controlsToggle=document.getElementById('controlsToggle');
    const controlsSummary=document.getElementById('controlsSummary');
    const filterMiniBar=document.getElementById('filterMiniBar');
    const fmTotal=document.getElementById('fmTotal');
    const fmFilters=document.getElementById('fmFilters');
    const fmOpenBtn=document.getElementById('fmOpenBtn');
    cityEl.hidden = true;
    cityEl.setAttribute('aria-hidden', 'true');
    cityEl.tabIndex = -1;
    cityEl.style.display = 'none';
    regionEl.hidden = true;
    regionEl.setAttribute('aria-hidden', 'true');
    regionEl.tabIndex = -1;
    regionEl.style.display = 'none';
    const sTotal=document.getElementById('sTotal'),sRegions=document.getElementById('sRegions'),sBargain=document.getElementById('sBargain'),sCheap=document.getElementById('sCheap');
    const CITY_COLOR={"수원":"#2563eb","용인수지":"#0f766e","서울양천":"#9333ea","서울강서":"#0284c7","서울영등포":"#0891b2","서울동작":"#dc2626","서울관악":"#ea580c","서울구로":"#16a34a","서울금천":"#ca8a04","서울성동":"#4f46e5","서울마포":"#7c3aed","서울용산":"#be123c","서울은평":"#0d9488","서울강동":"#1d4ed8","서울동대문":"#c2410c","서울광진":"#7e22ce","서울서대문":"#0f766e","서울성북":"#475569","서울강남":"#7c2d12","서울서초":"#b45309","서울송파":"#0f766e","서울노원":"#0e7490","서울도봉":"#65a30d","서울강북":"#9d174d","성남판교":"#0f766e","성남분당":"#2563eb","성남수정":"#be123c","성남중원":"#0891b2","안양":"#ea580c"};
    const SORT_DEFAULT={key:'price',dir:'asc'};
    const CUR_YEAR=new Date().getFullYear();
    const FIRST_DIR={city:'asc',title:'asc',featureDesc:'asc',tagText:'asc',price:'asc',avgPrice:'desc',diffPct:'asc',signal:'asc',statusLabel:'asc',areaSupplyPyeong:'desc',households:'desc',buildYear:'desc'};
    const sortState={...SORT_DEFAULT};
    const IS_MOBILE=window.matchMedia('(max-width: 900px)').matches;
    const REGION_INITIAL_ROWS=IS_MOBILE?10:30;
    const REGION_ROWS_STEP=IS_MOBILE?10:30;
    const REGION_INITIAL_BLOCKS=IS_MOBILE?2:8;
    const REGION_BLOCK_STEP=IS_MOBILE?2:8;
    const regionVisible=new Map();
    const collapsedRegions=new Set();
    let visibleRegionBlocks=REGION_INITIAL_BLOCKS;
    const esc=(s)=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    const uniq=(a)=>Array.from(new Set(a)).sort((x,y)=>String(x).localeCompare(String(y),'ko'));
    const selectedCities = new Set();
    const selectedRegions = new Set();
    const shortFeature=(s)=>{const t=String(s??'').trim(); return t ? (t.length>56 ? `${t.slice(0,56)}…` : t) : '-';};
    const mapUrl=(row)=>`https://map.naver.com/p/search/${encodeURIComponent(`${row.region} ${row.title}`)}`;
    const fullUrl=(u)=>{const t=String(u??'').trim(); if(!t) return '#'; return t.startsWith('/') ? `https://m.land.naver.com${t}` : t;};
    const signalClass=(v)=>v==='급매'?'b-bargain':(v==='저렴'?'b-cheap':'b-normal');
    const statusClass=(v)=>v==='다시 등록된 매물(판매중)'?'status-relisted':'status-active';
    function cityColor(city){ if(CITY_COLOR[city]) return CITY_COLOR[city]; const palette=["#2563eb","#0f766e","#9333ea","#0284c7","#dc2626","#16a34a","#ea580c"]; let h=0; for(const c of city) h=(h*31+c.charCodeAt(0))>>>0; return palette[h%palette.length]; }

    function getSelectedCities() {
      return Array.from(selectedCities);
    }

    function getSelectedRegions() {
      return Array.from(selectedRegions);
    }

    function getRegionSourceRows() {
      const cities = getSelectedCities();
      if (!cities.length) return [];
      const citySet = new Set(cities);
      return RAW.filter(x => citySet.has(x.city));
    }

    function syncHiddenCity() {
      cityEl.value = selectedCities.size === 1 ? getSelectedCities()[0] : '';
    }

    function syncHiddenRegion() {
      regionEl.value = selectedRegions.size === 1 ? getSelectedRegions()[0] : '';
    }

    function fillCities() {
      const c = uniq(RAW.map(x => x.city));
      cityEl.innerHTML = `<option value="">도시(전체)</option>` + c.map(v => `<option>${esc(v)}</option>`).join('');
      syncHiddenCity();
    }

    function regionLabel(name) {
      const i = String(name ?? '').indexOf('_');
      return i >= 0 ? String(name).slice(i + 1) : String(name ?? '');
    }

    function renderCityQuick() {
      const c = uniq(RAW.map(x => x.city));
      const noneSelected = selectedCities.size === 0;
      const seoulCities = c.filter(v => v.startsWith('서울'));
      const seoulAll = seoulCities.length > 0 && seoulCities.every(v => selectedCities.has(v));
      const chips = ['<button type="button" class="city-chip ' + (noneSelected ? 'active' : '') + '" data-city="">도시(전체)</button>',
              `<button type="button" class="city-chip ${seoulAll ? 'active' : ''}" data-group="seoul">서울 전체</button>`]
              .concat(c.map(v => `<button type="button" class="city-chip ${selectedCities.has(v) ? 'active' : ''}" data-city="${esc(v)}">${esc(v)}</button>`));
      const countText = selectedCities.size ? `${selectedCities.size}개 선택` : '전체';
      cityQuickEl.innerHTML = `<div class="city-quick-title"><span>도시 빠른 선택 (복수 선택)</span><span class="quick-count">${countText}</span></div><div class="city-quick-list">${chips.join('')}</div>`;
    }

    function renderRegionQuick() {
      if (selectedCities.size === 0) {
        const active = selectedRegions.size === 0 ? 'active' : '';
        const countText = selectedRegions.size ? `${selectedRegions.size}개 선택` : '전체';
        regionQuickEl.innerHTML = `<div class="region-quick-title"><span>지역 빠른 선택 (복수 선택)</span><span class="quick-count">${countText}</span></div><div class="region-quick-list"><button type="button" class="region-chip ${active}" data-region="">지역(전체)</button></div><div class="hint">도시를 먼저 1개 이상 선택하세요.</div>`;
        return;
      }
      const src = getRegionSourceRows();
      const regions = uniq(src.map(x => x.region));
      const regionSet = new Set(regions);
      for (const r of [...selectedRegions]) {
        if (!regionSet.has(r)) selectedRegions.delete(r);
      }
      syncHiddenRegion();
      const noneSelected = selectedRegions.size === 0;
      const chips = ['<button type="button" class="region-chip ' + (noneSelected ? 'active' : '') + '" data-region="">지역(전체)</button>']
              .concat(regions.map(v => `<button type="button" class="region-chip ${selectedRegions.has(v) ? 'active' : ''}" data-region="${esc(v)}">${esc(regionLabel(v))}</button>`));
      const countText = selectedRegions.size ? `${selectedRegions.size}개 선택` : '전체';
      regionQuickEl.innerHTML = `<div class="region-quick-title"><span>지역 빠른 선택 (복수 선택)</span><span class="quick-count">${countText}</span></div><div class="region-quick-list">${chips.join('')}</div>`;
    }

    function activeFilterCount() {
      let n = selectedCities.size + selectedRegions.size;
      if (priceEl.value) n++;
      if (pyeongEl.value) n++;
      if (hsehEl.value) n++;
      if (ageEl.value) n++;
      if (signalEl.value) n++;
      if (statusEl.value) n++;
      if (qEl.value.trim()) n++;
      return n;
    }

    function updateFilterSummaries(total) {
      const n = activeFilterCount();
      const label = n ? `활성 필터 ${n}개` : '필터 없음';
      controlsSummary.textContent = label;
      fmFilters.textContent = label;
      fmTotal.textContent = `노출 ${Number(total || 0).toLocaleString('ko-KR')}건`;
    }

    function setControlsCollapsed(collapsed) {
      controlsPanel.classList.toggle('collapsed', collapsed);
      controlsToggle.textContent = collapsed ? '필터 펼치기 ▾' : '필터 접기 ▴';
      controlsToggle.setAttribute('aria-expanded', String(!collapsed));
    }

    controlsToggle.addEventListener('click', () => {
      setControlsCollapsed(!controlsPanel.classList.contains('collapsed'));
    });

    fmOpenBtn.addEventListener('click', () => {
      setControlsCollapsed(false);
      controlsPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // 필터 패널이 화면 위로 완전히 지나가면 요약 미니바를 띄운다.
    function updateMiniBarVisibility() {
      filterMiniBar.hidden = controlsPanel.getBoundingClientRect().bottom > 0;
    }
    window.addEventListener('scroll', updateMiniBarVisibility, { passive: true });
    window.addEventListener('resize', updateMiniBarVisibility);
    updateMiniBarVisibility();

    function updateActiveFilterBar() {
      const chips = [];
      const cities = getSelectedCities();
      const regions = getSelectedRegions();
      const addChip = (label, type, value = '') => {
        const valueAttr = value ? ` data-value="${esc(value)}"` : '';
        chips.push(`<button type="button" class="af-chip" data-clear="${type}"${valueAttr}><span>${esc(label)}</span><span class="x">×</span></button>`);
      };

      cities.forEach(c => addChip(`도시: ${c}`, 'city', c));
      regions.forEach(r => addChip(`지역: ${regionLabel(r)}`, 'region', r));
      if (priceEl.value) addChip(`가격대: ${priceEl.value}`, 'price');
      if (pyeongEl.value) addChip(`평형: ${pyeongEl.value}`, 'pyeong');
      if (hsehEl.value) addChip(`세대수: ${hsehEl.selectedOptions[0].textContent}`, 'hseh');
      if (ageEl.value) addChip(`연식: ${ageEl.selectedOptions[0].textContent}`, 'age');
      if (signalEl.value) addChip(`판단: ${signalEl.value}`, 'signal');
      if (statusEl.value) addChip(`상태: ${statusEl.value}`, 'status');
      if (qEl.value.trim()) addChip(`검색: ${qEl.value.trim()}`, 'q');

      if (!chips.length) {
        activeFilterBar.hidden = true;
        activeFilterBar.innerHTML = '';
        return;
      }

      activeFilterBar.hidden = false;
      activeFilterBar.innerHTML = `<div class="af-title">활성 필터</div><div class="af-list">${chips.join('')}</div><button type="button" class="af-clear-all" data-clear="all">전체 해제</button>`;
    }

    function fillRegions() {
      const src = getRegionSourceRows();
      const r = uniq(src.map(x => x.region));
      regionEl.innerHTML = `<option value="">지역(전체)</option>` + r.map(v => `<option>${esc(v)}</option>`).join('');
      syncHiddenRegion();
    }

    function filtered() {
      const cities = getSelectedCities();
      const regions = getSelectedRegions();
      const citySet = cities.length ? new Set(cities) : null;
      const regionSet = regions.length ? new Set(regions) : null;
      const priceBand = priceEl.value, pyeongBand = pyeongEl.value, signal = signalEl.value, status = statusEl.value,
              q = qEl.value.trim().toLowerCase();
      const hsehBand = hsehEl.value ? hsehEl.value.split('-') : null;
      const ageBand = ageEl.value ? ageEl.value.split('-') : null;
      return RAW.filter(x => {
        if (citySet && !citySet.has(x.city)) return false;
        if (regionSet && !regionSet.has(x.region)) return false;
        if (priceBand && x.priceBand !== priceBand) return false;
        if (pyeongBand && x.pyeongBand !== pyeongBand) return false;
        if (hsehBand) {
          const h = Number(x.households || 0);
          if (!h) return false; // 세대수 미확인 매물은 구간 선택 시 제외
          if (h < Number(hsehBand[0])) return false;
          if (hsehBand[1] && h > Number(hsehBand[1])) return false;
        }
        if (ageBand) {
          const y = Number(x.buildYear || 0);
          if (!y) return false; // 연식 미확인 매물은 구간 선택 시 제외
          const age = CUR_YEAR - y;
          if (age < Number(ageBand[0])) return false;
          if (ageBand[1] && age > Number(ageBand[1])) return false;
        }
        if (signal && x.signal !== signal) return false;
        if (status && x.statusLabel !== status) return false;
        if (q && !`${x.region} ${x.title} ${x.featureDesc || ''} ${x.tagText || ''}`.toLowerCase().includes(q)) return false;
        return true;
      });
    }
    function compareRows(a,b,key){
      if(['city','title','featureDesc','tagText','signal','statusLabel','region'].includes(key)){
        return String(a[key]??'').localeCompare(String(b[key]??''),'ko');
      }
      const an=Number(a[key]??0), bn=Number(b[key]??0);
      if(!Number.isFinite(an) || !Number.isFinite(bn)) return 0;
      return an-bn;
    }
    function sortRows(rows){
      const arr=[...rows];
      arr.sort((a,b)=>{
        const cmp=compareRows(a,b,sortState.key);
        if(cmp!==0) return sortState.dir==='asc' ? cmp : -cmp;
        return Number(a.price)-Number(b.price);
      });
      return arr;
    }
    function sortIndicator(key){
      if(sortState.key!==key) return '↕';
      return sortState.dir==='asc' ? '↑' : '↓';
    }
    function diffText(v){const n=Number(v||0);const sign=n>0?'+':'';return `${sign}${n.toFixed(1)}%`;}
    function diffClass(v){return Number(v)<=0?'diff-neg':'diff-pos';}
    function resetRegionVisible(){regionVisible.clear();visibleRegionBlocks=REGION_INITIAL_BLOCKS;}
    function toggleRegionCollapsed(regionName){
      if(collapsedRegions.has(regionName)) collapsedRegions.delete(regionName);
      else collapsedRegions.add(regionName);
    }
    function renderPreservingScroll(previousY){
      render();
      const restoreY = typeof previousY === 'number' ? previousY : window.scrollY;
      requestAnimationFrame(()=>{
        const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        window.scrollTo(0, Math.min(restoreY, maxY));
      });
    }
    function forceRepaintRegions(){
      regionsEl.style.transform = 'translateZ(0)';
      void regionsEl.offsetHeight;
      requestAnimationFrame(()=>{
        regionsEl.style.transform = '';
      });
    }
    function render(){
      updateActiveFilterBar();
      const rows=sortRows(filtered());
      const g=new Map();
      for(const r of rows){if(!g.has(r.region))g.set(r.region,[]);g.get(r.region).push(r);}
      for(const key of [...collapsedRegions]){
        if(!g.has(key)) collapsedRegions.delete(key);
      }

      sTotal.textContent=String(rows.length);
      sRegions.textContent=String(g.size);
      sBargain.textContent=String(rows.filter(x=>x.signal==='급매').length);
      sCheap.textContent=String(rows.filter(x=>x.signal==='저렴').length);
      updateFilterSummaries(rows.length);

      if(!rows.length){
        regionsEl.innerHTML='<div class="empty">조건에 맞는 데이터가 없습니다.</div>';
        forceRepaintRegions();
        return;
      }
      const entries=[...g.entries()];
      const visibleEntries=entries.slice(0, visibleRegionBlocks);
      const hiddenRegions=entries.length-visibleEntries.length;

      regionsEl.innerHTML=visibleEntries.map(([name,items], idx)=>{
        const city=items[0]?.city||'';
        const accent=cityColor(city);
        const countBargain=items.filter(x=>x.signal==='급매').length;
        const countCheap=items.filter(x=>x.signal==='저렴').length;
        const countNormal=items.filter(x=>x.signal==='보통').length;
        const chips=`<span class="chip city">${esc(city)}</span><span class="chip s-bargain">급매 ${countBargain}</span><span class="chip s-cheap">저렴 ${countCheap}</span><span class="chip s-normal">보통 ${countNormal}</span>`;
        if(!regionVisible.has(name)) regionVisible.set(name, REGION_INITIAL_ROWS);
        const visibleCount=regionVisible.get(name) || REGION_INITIAL_ROWS;
        const visibleItems=items.slice(0, visibleCount);
        const hiddenCount=items.length - visibleItems.length;
        const regionKey=encodeURIComponent(name);
        const collapsed=collapsedRegions.has(name);
        const caret=collapsed ? '▸' : '▾';
        const collapseLabel=collapsed ? '펼치기' : '접기';

        const rowsHtml=visibleItems.map(it=>`<tr><td data-label="도시" class="city-col">${esc(it.city)}</td><td data-label="단지/매물" class="title-col">${esc(it.title)}</td><td data-label="세대수" class="dim hseh-col">${esc(it.householdsText || '-')}</td><td data-label="연식" class="dim hseh-col">${esc(it.buildYearText || '-')}</td><td data-label="특징" class="feature">${esc(shortFeature(it.featureDesc))}</td><td data-label="태그" class="tags">${esc(it.tagText || '-')}</td><td data-label="매물가" class="price">${esc(it.priceText)}</td><td data-label="단지 평균가">${esc(it.avgPriceText)}</td><td data-label="평균대비" class="${diffClass(it.diffPct)}">${esc(diffText(it.diffPct))}</td><td data-label="판단"><span class="badge ${signalClass(it.signal)}">${esc(it.signal)}</span></td><td data-label="상태"><span class="badge ${statusClass(it.statusLabel)}">${esc(it.statusLabel)}</span></td><td data-label="평형(공급/전용)" class="dim area-col">${esc(it.areaSupplyPyeongText)}평(${esc(it.areaSupplySqmText)}㎡) / ${esc(it.areaExclusivePyeongText)}평(${esc(it.areaExclusiveSqmText)}㎡)</td><td data-label="층" class="dim floor-col">${esc(it.floor)}</td><td data-label="매물" class="link-col"><a href="${esc(fullUrl(it.url))}" target="_blank">상세보기</a></td><td data-label="지도" class="link-col"><a href="${esc(mapUrl(it))}" target="_blank">지도</a></td></tr>`).join('');

        const headerCell=(label,key='')=>{
          if(!key) return `<th>${label}</th>`;
          const active=sortState.key===key ? 'active' : '';
          return `<th class="sortable ${active}" data-sort="${key}">${label}<span class="sort-indicator">${sortIndicator(key)}</span></th>`;
        };
        const headerHtml=`<tr>${headerCell('도시','city')}${headerCell('단지/매물','title')}${headerCell('세대수','households')}${headerCell('연식','buildYear')}${headerCell('특징','featureDesc')}${headerCell('태그','tagText')}${headerCell('매물가','price')}${headerCell('단지 평균가','avgPrice')}${headerCell('평균대비','diffPct')}${headerCell('판단','signal')}${headerCell('상태','statusLabel')}${headerCell('평형(공급/전용)','areaSupplyPyeong')}${headerCell('층')}${headerCell('매물')}${headerCell('지도')}</tr>`;

        const footerHtml = hiddenCount > 0 && !collapsed
          ? `<div class="region-footer"><button type="button" class="load-more" data-region-key="${regionKey}">+ ${Math.min(REGION_ROWS_STEP, hiddenCount)}건 더보기 (남은 ${hiddenCount}건)</button></div>`
          : '';
        const contentHtml = collapsed ? '' : `<div class="table-wrap"><table><thead>${headerHtml}</thead><tbody>${rowsHtml}</tbody></table></div>${footerHtml}`;
        return `<section class="region ${collapsed ? 'collapsed' : ''}" style="--accent:${accent};--delay:${Math.min(idx * 18, 180)}ms;"><div class="head" data-role="region-head" data-region-key="${regionKey}" role="button" tabindex="0" aria-expanded="${collapsed ? 'false' : 'true'}"><div class="title-wrap"><span class="collapse-caret">${caret}</span><div class="title">${esc(name)} <span style="color:#64748b;font-size:13px;">(${items.length}건)</span></div><span class="collapse-label">${collapseLabel}</span></div><div class="chips">${chips}</div></div>${contentHtml}</section>`;
      }).join('') + (hiddenRegions>0 ? `<div class="list-footer"><button type="button" class="load-more" data-role="load-more-regions">+ 지역 ${Math.min(REGION_BLOCK_STEP, hiddenRegions)}개 더보기 (남은 ${hiddenRegions}개)</button></div><div class="hint">모바일/저사양 브라우저 안정성을 위해 지역별로 나눠 렌더링합니다.</div>` : '');
      forceRepaintRegions();
    }

    activeFilterBar.addEventListener('click', (event) => {
      const btn = event.target.closest('[data-clear]');
      if (!btn) return;
      const type = btn.dataset.clear || '';
      const value = btn.dataset.value || '';

      if (type === 'all') {
        resetBtn.click();
        return;
      }
      if (type === 'city' && value) selectedCities.delete(value);
      if (type === 'region' && value) selectedRegions.delete(value);
      if (type === 'price') priceEl.value = '';
      if (type === 'pyeong') pyeongEl.value = '';
      if (type === 'hseh') hsehEl.value = '';
      if (type === 'age') ageEl.value = '';
      if (type === 'signal') signalEl.value = '';
      if (type === 'status') statusEl.value = '';
      if (type === 'q') qEl.value = '';

      if (type === 'city') {
        if (selectedCities.size === 0) selectedRegions.clear();
        else {
          const allowed = new Set(getRegionSourceRows().map(x => x.region));
          for (const r of [...selectedRegions]) {
            if (!allowed.has(r)) selectedRegions.delete(r);
          }
        }
      }

      syncHiddenCity();
      syncHiddenRegion();
      fillRegions();
      renderCityQuick();
      renderRegionQuick();
      resetRegionVisible();
      render();
    });

    regionsEl.addEventListener('click',(event)=>{
      const regionHead=event.target.closest('[data-role="region-head"]');
      if(regionHead){
        const key=decodeURIComponent(regionHead.dataset.regionKey || '');
        if(!key) return;
        toggleRegionCollapsed(key);
        render();
        return;
      }
      const loadRegionBtn=event.target.closest('button[data-role="load-more-regions"]');
      if(loadRegionBtn){
        const previousY = window.scrollY;
        visibleRegionBlocks += REGION_BLOCK_STEP;
        renderPreservingScroll(previousY);
        return;
      }
      const loadMoreBtn=event.target.closest('button.load-more');
      if(loadMoreBtn){
        const previousY = window.scrollY;
        const key=decodeURIComponent(loadMoreBtn.dataset.regionKey || '');
        const current=regionVisible.get(key) || REGION_INITIAL_ROWS;
        regionVisible.set(key, current + REGION_ROWS_STEP);
        renderPreservingScroll(previousY);
        return;
      }
      const th=event.target.closest('th[data-sort]');
      if(!th) return;
      const key=th.dataset.sort;
      if(!key) return;
      if(sortState.key===key){
        sortState.dir = sortState.dir==='asc' ? 'desc' : 'asc';
      }else{
        sortState.key = key;
        sortState.dir = FIRST_DIR[key] || 'asc';
      }
      render();
    });

    regionsEl.addEventListener('keydown',(event)=>{
      const regionHead=event.target.closest('[data-role="region-head"]');
      if(!regionHead) return;
      if(event.key!=='Enter' && event.key!==' ') return;
      event.preventDefault();
      const key=decodeURIComponent(regionHead.dataset.regionKey || '');
      if(!key) return;
      toggleRegionCollapsed(key);
      render();
    });

    cityQuickEl.addEventListener('click', (event) => {
      const btn = event.target.closest('button.city-chip');
      if (!btn) return;
      const city = btn.dataset.city || '';
      if (btn.dataset.group === 'seoul') {
        const seoulCities = uniq(RAW.map(x => x.city)).filter(v => v.startsWith('서울'));
        const allOn = seoulCities.length > 0 && seoulCities.every(v => selectedCities.has(v));
        seoulCities.forEach(v => allOn ? selectedCities.delete(v) : selectedCities.add(v));
      } else if (!city) {
        selectedCities.clear();
        selectedRegions.clear();
      } else {
        if (selectedCities.has(city)) selectedCities.delete(city);
        else selectedCities.add(city);
      }
      if (selectedCities.size === 0) {
        selectedRegions.clear();
      } else {
        const allowed = new Set(getRegionSourceRows().map(x => x.region));
        for (const r of [...selectedRegions]) {
          if (!allowed.has(r)) selectedRegions.delete(r);
        }
      }
      syncHiddenCity();
      syncHiddenRegion();
      fillRegions();
      resetRegionVisible();
      renderCityQuick();
      renderRegionQuick();
      render();
    });

    regionQuickEl.addEventListener('click', (event) => {
      const btn = event.target.closest('button.region-chip');
      if (!btn) return;
      const region = btn.dataset.region || '';
      if (!region) {
        selectedRegions.clear();
      } else {
        if (selectedRegions.has(region)) selectedRegions.delete(region);
        else selectedRegions.add(region);
      }
      syncHiddenRegion();
      resetRegionVisible();
      renderRegionQuick();
      render();
    });

    cityEl.addEventListener('change', () => {
      selectedCities.clear();
      if (cityEl.value) selectedCities.add(cityEl.value);
      fillRegions();
      resetRegionVisible();
      renderCityQuick();
      renderRegionQuick();
      render();
    });
    regionEl.addEventListener('change', () => {
      selectedRegions.clear();
      if (regionEl.value) selectedRegions.add(regionEl.value);
      resetRegionVisible();
      renderRegionQuick();
      render();
    });
    [priceEl, pyeongEl, hsehEl, ageEl, signalEl, statusEl].forEach(el => el.addEventListener('change', () => {
      resetRegionVisible();
      render();
    }));
    let qTimer=0;
    qEl.addEventListener('input',()=>{window.clearTimeout(qTimer);qTimer=window.setTimeout(()=>{resetRegionVisible();render();},180);});
    resetBtn.addEventListener('click', () => {
      selectedCities.clear();
      selectedRegions.clear();
      cityEl.value = '';
      regionEl.value = '';
      fillRegions();
      priceEl.value = '';
      pyeongEl.value = '';
      hsehEl.value = '';
      ageEl.value = '';
      signalEl.value = '';
      statusEl.value = '';
      qEl.value = '';
      sortState.key = SORT_DEFAULT.key;
      sortState.dir = SORT_DEFAULT.dir;
      resetRegionVisible();
      renderCityQuick();
      renderRegionQuick();
      render();
    });

    async function init(){
      try{
        const response = await fetch(DATA_URL, {cache:'no-store'});
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const loaded = await response.json();
        RAW = Array.isArray(loaded) ? loaded : [];
        fillCities();
        renderCityQuick();
        fillRegions();
        renderRegionQuick();
        render();
      }catch(error){
        console.error('report init failed', error);
        regionsEl.innerHTML='<div class="empty">데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</div>';
      }
    }
    init();
  </script>
</body>
</html>
